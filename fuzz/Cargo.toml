path = "fuzz_targets/config_files.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scim"
path = "fuzz_targets/scim.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_body"
path = "fuzz_targets/batch_body.rs"
