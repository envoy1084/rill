[package]
name = "rill-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace: fuzzing needs nightly and libFuzzer, which the
# main workspace must not depend on.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.5.0", features = ["derive"] }
rill-types = { path = "../crates/rill-types" }
rill-core = { path = "../crates/rill-core" }
rill-proto = { path = "../crates/rill-proto" }
rill-policy = { path = "../crates/rill-policy" }
rill-identity = { path = "../crates/rill-identity" }
rill-api = { path = "../crates/rill-api" }
prost = "0.14"
serde_json = "1"

[[bin]]
name = "decode_objects"
path = "fuzz_targets/decode_objects.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conflict_markers"
path = "fuzz_targets/conflict_markers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply_patch"
path = "fuzz_targets/apply_patch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repo_path"
path = "fuzz_targets/repo_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "symlink_target"
path = "fuzz_targets/symlink_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_convert"
path = "fuzz_targets/proto_convert.rs"
test = false
doc = false
bench = false

[[bin]]
