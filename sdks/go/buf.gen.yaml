version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      path: google
  override:
    - file_option: go_package_prefix
      value: github.com/rill-vcs/rill/sdks/go/gen
plugins:
  - local: protoc-gen-go
    out: sdks/go/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: sdks/go/gen
    opt: paths=source_relative
