[project]
name = "rill-sdk"
version = "0.1.0"
description = "Python client for the rill.v1 API: generated Connect clients and a thin layer"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "connect-python==0.9.0",
    "googleapis-common-protos==1.75.5",
    "protobuf==7.36.2",
]

[dependency-groups]
dev = [
    "protoc-gen-connect-python==0.9.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rill_sdk", "src/rill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
