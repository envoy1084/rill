[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/rill-types",
    "crates/rill-store",
    "crates/rill-core",
    "crates/rill-policy",
    "crates/rill-proto",
    "crates/rill-review",
    "crates/rill-lander",
    "crates/rill-search",
    "crates/rill-exec",
    "crates/rill-server",
    "crates/rill-sdk",
    "crates/rill-cli",
    "crates/rill-mcp",
    "crates/rill-git-import",
    "crates/rill-sim",
    "crates/rill-bench",
    "crates/rill-load",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/rill-vcs/rill"
authors = ["Rill contributors"]

[workspace.dependencies]
# Internal crates
rill-types = { path = "crates/rill-types" }
rill-store = { path = "crates/rill-store" }
rill-core = { path = "crates/rill-core" }
rill-policy = { path = "crates/rill-policy" }
rill-proto = { path = "crates/rill-proto" }
rill-review = { path = "crates/rill-review" }
rill-lander = { path = "crates/rill-lander" }
rill-search = { path = "crates/rill-search" }
rill-exec = { path = "crates/rill-exec" }
rill-server = { path = "crates/rill-server" }
rill-sdk = { path = "crates/rill-sdk" }
rill-git-import = { path = "crates/rill-git-import" }
rill-mcp = { path = "crates/rill-mcp" }

# Serialization and hashing
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", features = ["use-std"] }
blake3 = { version = "1.8.7", features = ["rayon"] }
hex = "0.4.3"
bytes = { version = "1.12.1", features = ["serde"] }
fastcdc = "5.0.0"
zstd = "0.14.3"

# Async and runtime
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
futures = "0.3.34"
async-trait = "0.1.92"

# RPC and HTTP
tonic = { version = "0.14.6", features = ["transport", "codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tonic-health = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
axum = { version = "0.8.9", features = ["http2"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
http = "1.5.0"
hyper = "1.12.0"
http-body-util = "0.1.5"
arc-swap = "1.9.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Storage
redb = "4.4.0"
foundationdb = { version = "0.11.0", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
foundationdb-tuple = "0.11.0"
object_store = "0.14.2"
url = "2.5.8"

# Diff and merge
imara-diff = "0.2.0"

# Policy and auth
cedar-policy = "4.14.0"
biscuit-auth = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
rand = "0.10.3"

# Errors, logging, misc
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
parking_lot = "0.12.5"
dashmap = "6.2.1"
libc = "0.2.191"
walkdir = "2.5.0"
ignore = "0.4.33"
globset = "0.4.20"
regex = "1.13.1"
regex-syntax = "0.8.11"
unicode-normalization = "0.1.26"
gix = { version = "0.89.0", default-features = false, features = ["parallel", "sha1"] }
toml = "1.1.8"
dirs = "7.0.0"
tempfile = "3.27.0"
proptest = "1.12.0"
similar-asserts = "2.0.0"

# Testing, benchmarking and fuzzing tools
criterion = { version = "0.8.2", features = ["async_tokio"] }
hdrhistogram = "7.6.0"
arbitrary = { version = "1.5.0", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev]
opt-level = 1
# Line tables only: full debuginfo makes each test binary several hundred MB.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
