[workspace]
resolver = "2"
exclude = ["tools/fuzz"]
members = ["crates/*/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/rill-vcs/rill"
authors = ["Rill contributors"]

[workspace.dependencies]
# Structural merge engine; pinned exactly, upgraded deliberately.
weave-core = "=0.6.1"
# Internal crates
rill-types = { path = "crates/foundation/types" }
rill-store = { path = "crates/foundation/store" }
rill-core = { path = "crates/engine/core" }
rill-merge-syntax = { path = "crates/engine/merge-syntax" }
rill-policy = { path = "crates/domain/policy" }
rill-proto = { path = "crates/foundation/proto" }
rill-reapi-proto = { path = "crates/foundation/reapi-proto" }
rill-review = { path = "crates/domain/review" }
rill-lander = { path = "crates/domain/lander" }
rill-events = { path = "crates/foundation/events" }
rill-jobs = { path = "crates/foundation/jobs" }
rill-search = { path = "crates/domain/search" }
rill-exec = { path = "crates/domain/exec" }
rill-runtime = { path = "crates/server/runtime" }
rill-api = { path = "crates/server/api" }
rill-cache = { path = "crates/server/cache" }
rill-sdk = { path = "crates/clients/sdk" }
rill-git-import = { path = "crates/domain/git-import" }
rill-mcp = { path = "crates/clients/mcp" }
rill-identity = { path = "crates/domain/identity" }

# Serialization and hashing
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", features = ["use-std"] }
blake3 = { version = "1.8.7", features = ["rayon"] }
hex = "0.4.3"
bytes = { version = "1.12.1", features = ["serde"] }
fastcdc = { version = "5.0.0", features = ["tokio"] }
zstd = "0.14.3"

# Async and runtime
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
futures = "0.3.34"
async-trait = "0.1.92"

# RPC and HTTP
# The rill.v1 API: ConnectRPC (gRPC, gRPC-web and Connect from one
# router) with buffa messages. Pre-1.0, so pinned exactly. tonic and prost
# remain for REAPI, which Bazel speaks as plain gRPC.
connectrpc = { version = "=0.9.1", features = ["client", "client-tls", "axum"] }
connectrpc-build = "=0.9.0"
buffa-codegen = "=0.9.2"
connectrpc-health = "=0.9.0"
connectrpc-reflection = "=0.9.0"
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
tonic = { version = "0.14.6", features = ["transport", "codegen", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-reflection = "0.14.6"
tonic-health = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
axum = { version = "0.8.9", features = ["http2"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-native-certs = "0.8.5"
rcgen = "0.14.10"
tower = "0.5.3"
http = "1.5.0"
arc-swap = "1.9.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "json", "form", "query"] }

# Storage
redb = "4.4.0"
foundationdb = { version = "0.11.0", default-features = false, features = ["fdb-7_3", "embedded-fdb-include"] }
foundationdb-tuple = "0.11.0"
object_store = "0.14.2"
url = "2.5.8"

# Diff and merge
imara-diff = "0.2.0"

# Policy and auth
cedar-policy = "4.14.0"
biscuit-auth = "6.0.0"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
aes-gcm = "0.11.1"
# SAML 2.0 sign-in; needs libxml2 and xmlsec1 (with OpenSSL) to build.
samael = "0.0.22"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
sha2 = "0.10.9"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
base64 = "0.23.1"
aws-config = { version = "1.13.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "credentials-process", "sso"] }
# Without the default `rustls` feature, which adds the legacy hyper 0.14 client.
aws-sdk-kms = { version = "1.124.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
gcp_auth = "0.12.7"
rand = "0.10.3"

# Errors, logging, misc
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
prometheus-client = "0.25.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
parking_lot = "0.12.5"
dashmap = "6.2.1"
libc = "0.2.191"
ignore = "0.4.33"
globset = "0.4.20"
regex = "1.13.1"
insta = { version = "1.49.0", features = ["json"] }
aho-corasick = "1.1"
landlock = "0.4.7"
seccompiler = "0.5.0"
openidconnect = { version = "4.0.1", default-features = false }
# Official MCP SDK; pinned, upgraded deliberately.
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io", "macros"] }
regex-syntax = "0.8.11"
unicode-normalization = "0.1.26"
gix = { version = "0.89.0", default-features = false, features = ["parallel", "sha1"] }
# Merge drivers (union) and `.gitattributes`; pinned with gix.
gix-merge = { version = "=0.22.0", default-features = false, features = ["sha1"] }
gix-imara-diff = "=0.3.1"
gix-attributes = "=0.37.0"
# Makes gix-attributes' names `Arc`-backed, so they cross threads.
gix-parallel = { version = "=0.50.0", features = ["parallel"] }
toml = "1.1.8"
dirs = "7.0.0"
tempfile = "3.27.0"
uuid = "1.28.0"
icu_casemap = "2.3.0"
backon = "1.6.0"
moka = { version = "0.12.16", features = ["sync"] }
quick-junit = "=0.8.0"
roaring = "0.11"
governor = "0.10.4"
# Pinned with weave-core, which depends on the same release.
sem-core = { version = "=0.28.1", features = ["grammar-all"] }
proptest = "1.12.0"

# Testing, benchmarking and fuzzing tools
criterion = { version = "0.8.2", features = ["async_tokio"] }
hdrhistogram = "7.6.0"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev]
opt-level = 1
# Line tables only: full debuginfo makes each test binary several hundred MB.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
