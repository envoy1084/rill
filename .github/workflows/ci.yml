name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Licences (ADR 015), advisories and sources, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The API protos follow buf's lint rules, and the generated API
      # reference matches them.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install buf and protoc-gen-doc
        env:
          BUF_VERSION: 1.75.0
          BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
        run: |
          curl -fsSL -o buf "https://github.com/bufbuild/buf/releases/download/v$BUF_VERSION/buf-Linux-x86_64"
          echo "$BUF_SHA256  buf" | sha256sum -c
          sudo install buf /usr/local/bin/buf
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: buf lint && buf generate --exclude-path proto/google
        working-directory: crates/foundation/proto
      - run: git diff --exit-code

  # The metadata store conformance suite and the end-to-end server test
  # against a real single-node FoundationDB.
  foundationdb:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FDB_VERSION: 7.3.77
      FDB_CLIENTS_SHA256: b6c263723009bddbc30b6ae8cf9854340bd35cef14152abb0da8fb5af2b91254
      FDB_SERVER_SHA256: 789f1ed4cbacc0fd7043da2217c9e57516e4ec94fa7140853ec22a7e715785cc
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: fdb
      - name: Install FoundationDB
        run: |
          base=https://github.com/apple/foundationdb/releases/download/$FDB_VERSION
          curl -fsSLO "$base/foundationdb-clients_$FDB_VERSION-1_amd64.deb"
          curl -fsSLO "$base/foundationdb-server_$FDB_VERSION-1_amd64.deb"
          echo "$FDB_CLIENTS_SHA256  foundationdb-clients_$FDB_VERSION-1_amd64.deb" | sha256sum -c
          echo "$FDB_SERVER_SHA256  foundationdb-server_$FDB_VERSION-1_amd64.deb" | sha256sum -c
          sudo dpkg -i foundationdb-clients_*.deb foundationdb-server_*.deb
          # The package starts a single-node cluster; configure it if the
          # install did not.
          for i in $(seq 30); do
            fdbcli --exec status --timeout 5 | grep -q "Healthy" && exit 0
            if [ "$i" = 5 ]; then
              sudo fdbcli --exec "configure new single memory" --timeout 10 || true
            fi
            sleep 2
          done
          fdbcli --exec status
          exit 1
      - run: cargo clippy -p rill-store -p rill-api -p rill-cli --all-targets --features rill-store/fdb,rill-store/s3,rill-api/fdb
      - run: cargo test -p rill-store --features fdb,s3
      - run: cargo test -p rill-api --features fdb --test grpc
