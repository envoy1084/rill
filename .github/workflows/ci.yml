name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      # The toolchain and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Clients ship without the services (ADR 020).
      - name: The client binaries link no server crates
        run: |
          bad=$(cargo tree -p rill-cli -p rill-mcp -e normal,build --prefix none \
            | awk '{print $1}' | sort -u \
            | grep -xE 'rill-(api|runtime|server|cache|lander|exec|identity|review|search|events|jobs)' || true)
          if [ -n "$bad" ]; then echo "client links server crates: $bad"; exit 1; fi
      # Licences (ADR 015), advisories and sources, per deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: cargo clippy --workspace --all-targets
      # fusermount3, so the daemon's FUSE tests mount for real.
      - run: sudo apt-get install -y fuse3
      - run: cargo test --workspace
      # Everything generated from the protos (the API reference and the
      # Go, TypeScript and Python SDKs) matches them, and every SDK passes
      # the conformance scenarios against `rill dev`.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The TypeScript workspace: the SDK and the VS Code extension build,
      # typecheck and pass their offline tests.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck && pnpm -r build && pnpm -r test
      - uses: astral-sh/setup-uv@v6
      - name: Install buf, protoc and the protoc plugins
        env:
          BUF_VERSION: 1.75.0
          BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
          PROTOC_VERSION: "36.2"
          PROTOC_SHA256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o buf "https://github.com/bufbuild/buf/releases/download/v$BUF_VERSION/buf-Linux-x86_64"
          echo "$BUF_SHA256  buf" | sha256sum -c
          sudo install buf /usr/local/bin/buf
          zip="protoc-$PROTOC_VERSION-linux-x86_64.zip"
          curl -fsSLO "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/$zip"
          echo "$PROTOC_SHA256  $zip" | sha256sum -c
          sudo unzip -q -o "$zip" -d /usr/local bin/protoc 'include/*'
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: sdks/generate.sh
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: sdks/conformance/run.sh

  # The metadata store conformance suite and the end-to-end server test
  # against a real single-node FoundationDB.
  foundationdb:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FDB_VERSION: 7.3.77
      FDB_CLIENTS_SHA256: b6c263723009bddbc30b6ae8cf9854340bd35cef14152abb0da8fb5af2b91254
      FDB_SERVER_SHA256: 789f1ed4cbacc0fd7043da2217c9e57516e4ec94fa7140853ec22a7e715785cc
    steps:
      - uses: useblacksmith/checkout@v1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: fdb
      - name: Install FoundationDB
        run: |
          base=https://github.com/apple/foundationdb/releases/download/$FDB_VERSION
          curl -fsSLO "$base/foundationdb-clients_$FDB_VERSION-1_amd64.deb"
          curl -fsSLO "$base/foundationdb-server_$FDB_VERSION-1_amd64.deb"
          echo "$FDB_CLIENTS_SHA256  foundationdb-clients_$FDB_VERSION-1_amd64.deb" | sha256sum -c
          echo "$FDB_SERVER_SHA256  foundationdb-server_$FDB_VERSION-1_amd64.deb" | sha256sum -c
          sudo dpkg -i foundationdb-clients_*.deb foundationdb-server_*.deb
          # The package starts a single-node cluster; configure it if the
          # install did not.
          for i in $(seq 30); do
            fdbcli --exec status --timeout 5 | grep -q "Healthy" && exit 0
            if [ "$i" = 5 ]; then
              sudo fdbcli --exec "configure new single memory" --timeout 10 || true
            fi
            sleep 2
          done
          fdbcli --exec status
          exit 1
      - run: cargo clippy -p rill-store -p rill-api -p rill-server --all-targets --features rill-store/fdb,rill-store/s3,rill-api/fdb
      - run: cargo test -p rill-store --features fdb,s3
      - run: cargo test -p rill-api --features fdb --test grpc
