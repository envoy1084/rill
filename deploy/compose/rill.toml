# The staging servers' configuration. Every server runs every role; leases
# and job claims share the background work between them.

listen_grpc = "0.0.0.0:7420"
listen_http = "0.0.0.0:7421"

[storage]
kind = "s3"
url = "s3://rill"
prefix = "staging"

[metadata]
kind = "fdb"
cluster_file = "/etc/foundationdb/fdb.cluster"
root = "rill-staging"

# Token keys are wrapped with the master key in RILL_MASTER_KEY (set in
# docker-compose.yml). Tokens come from `rill-server mint-token`; see README.
[identity]
admins = ["staging-admin"]

[identity.keys]
backend = "local"

[shutdown]
drain_secs = 2
grace_secs = 20

[telemetry]
log_format = "json"
