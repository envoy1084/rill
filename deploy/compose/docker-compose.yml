# A staging cluster on one machine: single-node FoundationDB, SeaweedFS as
# the S3-compatible object store, three rill servers behind nginx,
# Prometheus and Grafana.
#
#   docker build -t rill:dev ../..
#   docker compose up -d
#   export RILL_ENDPOINT=http://localhost:7470 RILL_TOKEN=staging-admin
#
# gRPC on :7470 and the object protocol on :7471 (both through nginx),
# Grafana on :3000 (admin/admin), Prometheus on :9090, S3 on :8333.

x-rill: &rill
  image: ${RILL_IMAGE:-rill:dev}
  command: ["api", "--config", "/etc/rill/rill.toml"]
  environment:
    AWS_ENDPOINT: http://seaweedfs:8333
    AWS_ALLOW_HTTP: "true"
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: rill
    AWS_SECRET_ACCESS_KEY: rill-staging-secret
    RILL_LOG_FORMAT: json
  volumes:
    - ./rill.toml:/etc/rill/rill.toml:ro
    - ./fdb.cluster:/etc/foundationdb/fdb.cluster:ro
  depends_on:
    fdb-init:
      condition: service_completed_successfully
    s3-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  fdb:
    image: foundationdb/foundationdb:7.3.77
    platform: linux/amd64
    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: "4500"
    volumes:
      - fdb-data:/var/fdb/data

  fdb-init:
    image: foundationdb/foundationdb:7.3.77
    platform: linux/amd64
    depends_on: [fdb]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "docker:docker@fdb:4500" > /tmp/fdb.cluster
        for i in $$(seq 60); do
          if fdbcli -C /tmp/fdb.cluster --exec status --timeout 5 | grep -q Healthy; then exit 0; fi
          fdbcli -C /tmp/fdb.cluster --exec "configure new single ssd" --timeout 10 || true
          sleep 2
        done
        exit 1

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["8333:8333"]
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data

  s3-init:
    image: chrislusf/seaweedfs:latest
    depends_on: [seaweedfs]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 60); do
          echo "s3.bucket.create -name rill" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1
          echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null | grep -q rill && exit 0
          sleep 2
        done
        exit 1

  rill1: *rill
  rill2: *rill
  rill3: *rill

  lb:
    image: nginx:1.27
    depends_on: [rill1, rill2, rill3]
    ports: ["7470:7470", "7471:7471"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/rill.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/rill.yml:ro
      - ../grafana:/var/lib/grafana/dashboards/rill:ro

volumes:
  fdb-data:
  s3-data:
