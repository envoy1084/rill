# Round-robin over the three servers: gRPC (HTTP/2 cleartext) on 7470 and
# the object protocol on 7471. A server that fails is skipped for 5 s.
# Upstream connections are kept alive: without it every request opens a
# new connection to a server.
worker_processes auto;

events {
  worker_connections 16384;
}

http {
  upstream rill_grpc {
    server rill1:7420 max_fails=1 fail_timeout=5s;
    server rill2:7420 max_fails=1 fail_timeout=5s;
    server rill3:7420 max_fails=1 fail_timeout=5s;
    keepalive 256;
  }
  upstream rill_http {
    server rill1:7421 max_fails=1 fail_timeout=5s;
    server rill2:7421 max_fails=1 fail_timeout=5s;
    server rill3:7421 max_fails=1 fail_timeout=5s;
    keepalive 256;
  }

  server {
    listen 7470;
    http2 on;
    # One client connection carries many requests: nginx's defaults close
    # it after 1,000 and allow 128 at a time.
    keepalive_requests 1000000;
    keepalive_timeout 1h;
    http2_max_concurrent_streams 4096;
    location / {
      grpc_pass grpc://rill_grpc;
      grpc_read_timeout 1h;
      grpc_send_timeout 1h;
      grpc_next_upstream error timeout http_502 http_503;
    }
  }

  server {
    listen 7471;
    client_max_body_size 256m;
    location / {
      proxy_pass http://rill_http;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
