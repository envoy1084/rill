{{- if gt (int .Values.exec.workers.replicas) 0 }}
{{- $secret := required "exec.workerSecret is required for workers" .Values.exec.workerSecret }}
# Buildbarn's worker and runner configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rill.name" . }}-exec-worker
  labels:
    {{- include "rill.labels" . | nindent 4 }}
data:
  worker.jsonnet: |
    {{- .Files.Get "files/exec/worker.jsonnet" | nindent 4 }}
  runner.jsonnet: |
    {{- .Files.Get "files/exec/runner.jsonnet" | nindent 4 }}
---
# Remote execution workers: bb_worker takes actions from Rill and runs them
# through bb_runner. The pod runs under gVisor; the runner's root is
# read-only and its /tmp is emptied between actions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rill.name" . }}-exec-worker
  labels:
    {{- include "rill.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.exec.workers.replicas }}
  selector:
    matchLabels:
      {{- include "rill.workerSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rill.workerSelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/exec/worker.jsonnet" | sha256sum }}
    spec:
      runtimeClassName: {{ .Values.exec.workers.runtimeClassName }}
      automountServiceAccountToken: false
      initContainers:
        - name: install-runner
          image: "ghcr.io/buildbarn/bb-runner-installer:{{ .Values.exec.workers.buildbarnTag }}"
          args: ["/bb"]
          volumeMounts:
            - { name: bb, mountPath: /bb }
      containers:
        - name: worker
          image: "ghcr.io/buildbarn/bb-worker:{{ .Values.exec.workers.buildbarnTag }}"
          args: ["/buildbarn/worker.jsonnet"]
          env:
            - name: RILL_ENDPOINT
              value: "{{ include "rill.name" . }}:{{ .Values.service.grpcPort }}"
            - name: RILL_WORKER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $secret | quote }}, key: secret }
            - name: RILL_WORKER_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: RILL_WORKER_CONCURRENCY
              value: {{ .Values.exec.workers.concurrency | quote }}
          volumeMounts:
            - { name: config, mountPath: /buildbarn }
            - { name: work, mountPath: /worker }
        - name: runner
          image: {{ .Values.exec.workers.runnerImage | quote }}
          command: ["sh", "-c", "rm -f /worker/runner; exec /bb/bb_runner /buildbarn/runner.jsonnet"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.exec.workers.resources | nindent 12 }}
          volumeMounts:
            - { name: bb, mountPath: /bb, readOnly: true }
            - { name: config, mountPath: /buildbarn }
            - { name: work, mountPath: /worker }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: bb, emptyDir: {} }
        - { name: work, emptyDir: {} }
        - { name: tmp, emptyDir: { medium: Memory } }
        - name: config
          configMap: { name: {{ include "rill.name" . }}-exec-worker }
---
# Workers reach only Rill and DNS; actions share the pod's network, so this
# is what keeps them off everything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rill.name" . }}-exec-worker
  labels:
    {{- include "rill.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rill.workerSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "rill.selector" . | nindent 14 }}
      ports:
        - { port: {{ .Values.service.grpcPort }}, protocol: TCP }
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
{{- end }}
