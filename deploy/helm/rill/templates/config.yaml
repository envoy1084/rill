# The server configuration. A Secret, so a complete configuration with
# credentials can replace it (existingConfigSecret).
{{- if not .Values.existingConfigSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rill.name" . }}-config
  labels:
    {{- include "rill.labels" . | nindent 4 }}
stringData:
  rill.toml: |
    listen_grpc = "0.0.0.0:{{ .Values.service.grpcPort }}"
    listen_http = "0.0.0.0:{{ .Values.service.httpPort }}"

    [storage]
    kind = "s3"
    url = {{ .Values.s3.url | quote }}
    prefix = {{ .Values.s3.prefix | quote }}

    [metadata]
    kind = "fdb"
    cluster_file = "/etc/foundationdb/fdb.cluster"
    root = {{ .Values.fdb.root | quote }}

    [identity]
    admins = [{{- range $i, $a := .Values.identity.admins }}{{ if $i }}, {{ end }}{{ $a | quote }}{{- end }}]

    [identity.keys]
    backend = {{ .Values.identity.keyService | quote }}
    {{- if eq .Values.identity.keyService "vault" }}
    address = {{ required "identity.vault.address" .Values.identity.vault.address | quote }}
    key = {{ .Values.identity.vault.key | quote }}
    mount = {{ .Values.identity.vault.mount | quote }}
    {{- else if eq .Values.identity.keyService "aws-kms" }}
    key_id = {{ required "identity.awsKms.keyId" .Values.identity.awsKms.keyId | quote }}
    {{- if .Values.identity.awsKms.region }}
    region = {{ .Values.identity.awsKms.region | quote }}
    {{- end }}
    {{- else if eq .Values.identity.keyService "gcp-kms" }}
    key_name = {{ required "identity.gcpKms.keyName" .Values.identity.gcpKms.keyName | quote }}
    {{- end }}
    {{- if .Values.tls.secret }}

    [tls]
    cert = "/etc/rill/tls/tls.crt"
    key = "/etc/rill/tls/tls.key"
    {{- if .Values.tls.clientCaKey }}
    client_ca = "/etc/rill/tls/{{ .Values.tls.clientCaKey }}"
    {{- end }}
    {{- end }}

    {{- if .Values.exec.workerSecret }}

    [exec]
    worker_secret_file = "/etc/rill/exec/secret"
    {{- end }}

    [shutdown]
    drain_secs = {{ .Values.shutdown.drainSecs }}
    grace_secs = {{ .Values.shutdown.graceSecs }}

    [telemetry]
    log_format = {{ .Values.telemetry.logFormat | quote }}
    {{- if .Values.telemetry.otlpEndpoint }}
    otlp_endpoint = {{ .Values.telemetry.otlpEndpoint | quote }}
    {{- end }}
{{- end }}
