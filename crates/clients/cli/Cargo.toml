[package]
name = "rill-cli"
description = "The `rill` command: the client and the checkout daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rill_cli"
path = "src/lib.rs"

[[bin]]
name = "rill"
path = "src/bin/rill.rs"


[dependencies]
rill-sdk = { workspace = true }
rill-daemon = { workspace = true }
connectrpc = { workspace = true }
rill-mcp = { workspace = true }
rill-types = { workspace = true }
rill-core = { workspace = true }
rill-git-import = { workspace = true }
rill-proto = { workspace = true }
rill-policy = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
comfy-table = { workspace = true }
owo-colors = { workspace = true }
shlex = { workspace = true }
tempfile = { workspace = true }
terminal_size = { workspace = true }
similar = { workspace = true }
syntect = { workspace = true }
indicatif = { workspace = true }
inquire = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
ansi-to-tui = { workspace = true }
supports-hyperlinks = { workspace = true }
clap_mangen = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# The tests run a server in-process and drive it through the CLI.
rill-api = { workspace = true }
rill-runtime = { workspace = true }
rill-cache = { workspace = true }
rill-store = { workspace = true }
insta = { workspace = true }
regex = { workspace = true }
rill-identity = { workspace = true, features = ["testing"] }
rill-policy = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
