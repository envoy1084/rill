[package]
name = "rill-mcp"
description = "MCP server exposing Rill to agents over stdio and streamable HTTP, plus the JSON encoding of SDK values shared with the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rill-mcp"
path = "src/bin/rill_mcp.rs"

[dependencies]
rmcp = { workspace = true }
rill-sdk = { workspace = true }
rill-types = { workspace = true }
rill-core = { workspace = true }
rill-proto = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
rill-sdk = { workspace = true, features = ["testing"] }
reqwest = { workspace = true }
