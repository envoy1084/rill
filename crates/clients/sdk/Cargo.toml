[package]
name = "rill-sdk"
description = "Typed client library over the rill.v1 API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `testing::DevServer`: an in-process dev server for tests built on the SDK.
testing = ["dep:rill-api", "dep:tokio-util"]

[dependencies]
rill-api = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
backon = { workspace = true }
tempfile = { workspace = true }
rill-types = { workspace = true }
hex = { workspace = true }
rill-proto = { workspace = true }
connectrpc = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
buffa = { workspace = true }
buffa-types = { workspace = true }
http = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-native-certs = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
hdrhistogram = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
buffa = { workspace = true }
connectrpc = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }

[[test]]
name = "conformance"
required-features = ["testing"]

[[test]]
name = "workspace_snapshots"
required-features = ["testing"]

[[test]]
name = "cache_tier"
required-features = ["testing"]

[[test]]
name = "land_cancel"
required-features = ["testing"]

[[test]]
name = "amend"
required-features = ["testing"]
