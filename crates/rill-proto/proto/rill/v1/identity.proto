// Identity service: token signing keys, revocation and sessions.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

service IdentityService {
  // Revoke a token (and every token attenuated from it). Callers may
  // revoke a token they present; administrators any token id.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  // End a session; every token issued under it is refused from then on.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Store a new signing key now; it activates after the activation delay.
  rpc RotateTokenKeys(RotateTokenKeysRequest) returns (RotateTokenKeysResponse);
  rpc ListTokenKeys(ListTokenKeysRequest) returns (ListTokenKeysResponse);

  // An organization's OpenID Connect providers; org administrators.
  rpc PutIdentityProvider(PutIdentityProviderRequest) returns (PutIdentityProviderResponse);
  rpc ListIdentityProviders(ListIdentityProvidersRequest) returns (ListIdentityProvidersResponse);
  rpc DeleteIdentityProvider(DeleteIdentityProviderRequest) returns (DeleteIdentityProviderResponse);

  // An organization's users; org administrators.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Suspend or reactivate a user, or set their roles. Suspension refuses
  // every token the user holds at once.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // Agents: org administrators, or a user for agents they sponsor.
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // Issuers whose workload JWTs may be exchanged for agent tokens; org
  // administrators.
  rpc PutWorkloadIssuer(PutWorkloadIssuerRequest) returns (PutWorkloadIssuerResponse);
  rpc ListWorkloadIssuers(ListWorkloadIssuersRequest) returns (ListWorkloadIssuersResponse);
  rpc DeleteWorkloadIssuer(DeleteWorkloadIssuerRequest) returns (DeleteWorkloadIssuerResponse);

  // Stop an agent, a session, everything a sponsor's agents do, or every
  // agent running as a model; org administrators. Tokens are refused at
  // once, and the lander ejects their queued work.
  rpc KillSwitch(KillSwitchRequest) returns (KillSwitchResponse);
}

message KillSwitchRequest {
  bytes operation_id = 1;
  string org = 2;
  oneof target {
    string agent = 3;
    // `ss_…`
    string session = 4;
    // `user:<name>` or `team:<name>`.
    string sponsor = 5;
    string model = 6;
  }
  string reason = 7;
}
message KillSwitchResponse {
  repeated string agents_suspended = 1;
  repeated string sessions_revoked = 2;
  repeated string models_blocked = 3;
}

message AgentBudgets {
  optional uint64 versions_per_day = 1;
  optional uint64 lands_per_day = 2;
  optional uint64 requests_per_minute = 3;
}

message WorkloadBinding {
  string issuer = 1;
  // The `sub` claim; a trailing `*` matches any suffix.
  string subject = 2;
  // Further claims that must equal these values.
  map<string, string> claims = 3;
}

message AgentSpec {
  string org = 1;
  string name = 2;
  // `user:<name>` or `team:<name>`.
  string sponsor = 3;
  string purpose = 4;
  // Repository names in the org; `*` for all.
  repeated string repos = 5;
  // Path prefixes; empty for every path.
  repeated string paths = 6;
  // Models it may run as; empty for any.
  repeated string models = 7;
  AgentBudgets budgets = 8;
  repeated WorkloadBinding workloads = 9;
  optional int64 expires_at = 10;
}

message Agent {
  AgentSpec spec = 1;
  Principal principal = 2;
  // `active` or `suspended`.
  string status = 3;
  Principal created_by = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message RegisterAgentRequest {
  bytes operation_id = 1;
  AgentSpec agent = 2;
}
message RegisterAgentResponse {
  Agent agent = 1;
}
message UpdateAgentRequest {
  bytes operation_id = 1;
  string org = 2;
  string name = 3;
  optional bool suspended = 4;
  // Replaces the registration's sponsor, scope, models, budgets, bindings
  // and expiry when set; the org and name must match.
  AgentSpec spec = 5;
}
message UpdateAgentResponse {
  Agent agent = 1;
}
message ListAgentsRequest {
  string org = 1;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
}

message WorkloadIssuerSpec {
  string org = 1;
  string name = 2;
  string issuer = 3;
  oneof keys {
    // OIDC discovery at the issuer.
    bool discovery = 4;
    string jwks_uri = 5;
    // A JWKS document.
    string jwks = 6;
  }
  repeated string audiences = 7;
}
message PutWorkloadIssuerRequest {
  bytes operation_id = 1;
  WorkloadIssuerSpec issuer = 2;
}
message PutWorkloadIssuerResponse {
  WorkloadIssuerSpec issuer = 1;
}
message ListWorkloadIssuersRequest {
  string org = 1;
}
message ListWorkloadIssuersResponse {
  repeated WorkloadIssuerSpec issuers = 1;
}
message DeleteWorkloadIssuerRequest {
  bytes operation_id = 1;
  string org = 2;
  string name = 3;
}
message DeleteWorkloadIssuerResponse {
  bool deleted = 1;
}

message IdentityProviderSpec {
  string org = 1;
  string name = 2;
  string issuer = 3;
  string client_id = 4;
  // Wrapped by the instance's key service before it is stored; never
  // returned.
  optional string client_secret = 5;
  optional string cli_client_id = 6;
  repeated string scopes = 7;
  // Defaults to `preferred_username`.
  optional string username_claim = 8;
  optional string groups_claim = 9;
  bool auto_provision = 10;
}
message IdentityProviderInfo {
  string org = 1;
  string name = 2;
  string issuer = 3;
  string client_id = 4;
  bool has_client_secret = 5;
  optional string cli_client_id = 6;
  repeated string scopes = 7;
  string username_claim = 8;
  optional string groups_claim = 9;
  bool auto_provision = 10;
  int64 created_at = 11;
}

message PutIdentityProviderRequest {
  bytes operation_id = 1;
  IdentityProviderSpec provider = 2;
}
message PutIdentityProviderResponse {
  IdentityProviderInfo provider = 1;
}
message ListIdentityProvidersRequest {
  string org = 1;
}
message ListIdentityProvidersResponse {
  repeated IdentityProviderInfo providers = 1;
}
message DeleteIdentityProviderRequest {
  bytes operation_id = 1;
  string org = 2;
  string name = 3;
}
message DeleteIdentityProviderResponse {
  bool deleted = 1;
}

message User {
  string org = 1;
  Principal principal = 2;
  optional string email = 3;
  optional string display_name = 4;
  // `active` or `suspended`.
  string status = 5;
  // `admin`.
  repeated string roles = 6;
  repeated string teams = 7;
  // `issuer#subject` for each linked identity.
  repeated string external = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}
message ListUsersRequest {
  string org = 1;
}
message ListUsersResponse {
  repeated User users = 1;
}
message UpdateUserRequest {
  bytes operation_id = 1;
  string org = 2;
  string name = 3;
  optional bool suspended = 4;
  // Replace the user's roles with `roles` when set.
  bool set_roles = 5;
  repeated string roles = 6;
}
message UpdateUserResponse {
  User user = 1;
}

message RevokeTokenRequest {
  bytes operation_id = 1;
  oneof target {
    // The token itself: revokes its token id.
    string token = 2;
    // `tk_…`; administrators only.
    string token_id = 3;
  }
  string reason = 4;
}
message RevokeTokenResponse {
  string token_id = 1;
}

message RevokeSessionRequest {
  bytes operation_id = 1;
  // `ss_…`
  string session = 2;
}
message RevokeSessionResponse {}

message RotateTokenKeysRequest {
  bytes operation_id = 1;
}
message RotateTokenKeysResponse {
  // Absent when another server rotated at the same moment.
  optional uint32 key_id = 1;
  int64 active_from = 2;
}

message ListTokenKeysRequest {}
message TokenKey {
  uint32 id = 1;
  // Hex compressed P-256 public key.
  string public_key = 2;
  // The key service that wraps it and the wrapping key.
  string backend = 3;
  string key_ref = 4;
  int64 created_at = 5;
  int64 active_from = 6;
  optional int64 not_after = 7;
}
message ListTokenKeysResponse {
  repeated TokenKey keys = 1;
}

// Signing in. Open: callers have no token yet, and each RPC checks what it
// is given.
service SessionService {
  // The organization's providers a client can sign in through, with the
  // endpoints of their device flow.
  rpc ListSignInProviders(ListSignInProvidersRequest) returns (ListSignInProvidersResponse);
  // RFC 8693: a provider's ID token for a session.
  rpc ExchangeToken(ExchangeTokenRequest) returns (SessionGrant);
  // A refresh token for a new access token and a new refresh token.
  rpc RefreshSession(RefreshSessionRequest) returns (SessionGrant);
}

message ListSignInProvidersRequest {
  string org = 1;
}
message SignInProvider {
  string org = 1;
  string name = 2;
  string issuer = 3;
  optional string cli_client_id = 4;
  repeated string scopes = 5;
  optional string device_authorization_endpoint = 6;
  optional string token_endpoint = 7;
}
message ListSignInProvidersResponse {
  repeated SignInProvider providers = 1;
}

message ExchangeTokenRequest {
  string subject_token = 1;
  // `urn:ietf:params:oauth:token-type:id_token` (a person), or
  // `urn:ietf:params:oauth:token-type:jwt` (a workload, for an agent).
  string subject_token_type = 2;
  // For workloads: the org whose trusted issuer signed the JWT.
  string org = 3;
  // For workloads: the agent, when several bindings match.
  optional string agent = 4;
  // For workloads: the model the agent runs as.
  optional string model = 5;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message SessionGrant {
  string access_token = 1;
  int64 expires_at = 2;
  optional string refresh_token = 3;
  string session = 4;
  Principal principal = 5;
  string org = 6;
}
