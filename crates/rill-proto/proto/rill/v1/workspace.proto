// Workspace service: server-side working copies with an operation log.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc SetSparseProfile(SetSparseProfileRequest) returns (SetSparseProfileResponse);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc NewChange(NewChangeRequest) returns (NewChangeResponse);
  rpc UpdateBase(UpdateBaseRequest) returns (UpdateBaseResponse);
  rpc Handoff(HandoffRequest) returns (HandoffResponse);
  rpc Undo(UndoRequest) returns (UndoResponse);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
  rpc WorkspaceDiff(WorkspaceDiffRequest) returns (WorkspaceDiffResponse);
}

message CreateWorkspaceRequest {
  bytes operation_id = 1;
  string repo = 2;
  string name = 3;
  // Defaults to trunk head.
  RootSpec base = 4;
  SparseProfile sparse = 5;
}
message CreateWorkspaceResponse {
  Workspace workspace = 1;
  Operation operation = 2;
}

message GetWorkspaceRequest {
  string repo = 1;
  bytes workspace = 2;
}
message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {
  string repo = 1;
  optional bytes owner = 2;
  uint32 limit = 3;
  optional string page_token = 4;
}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  optional string next_page_token = 2;
}

message SetSparseProfileRequest {
  bytes operation_id = 1;
  string repo = 2;
  bytes workspace = 3;
  SparseProfile sparse = 4;
}
message SetSparseProfileResponse {
  Workspace workspace = 1;
  Operation operation = 2;
}

message SnapshotRequest {
  bytes operation_id = 1;
  string repo = 2;
  bytes workspace = 3;
  // Root tree of the working copy; its objects must already be uploaded.
  bytes tree_hash = 4;
}
message SnapshotResponse {
  Operation operation = 1;
}

message NewChangeRequest {
  bytes operation_id = 1;
  string repo = 2;
  bytes workspace = 3;
  string message = 4;
  optional bytes intent = 5;
  Provenance provenance = 6;
}
message NewChangeResponse {
  bytes change_id = 1;
  bytes version_hash = 2;
  ChangeVersion version = 3;
  Operation operation = 4;
}

message UpdateBaseRequest {
  bytes operation_id = 1;
  string repo = 2;
  bytes workspace = 3;
  // Defaults to trunk head.
  RootSpec new_base = 4;
}
message UpdateBaseResponse {
  Workspace workspace = 1;
  Operation operation = 2;
  // The rebased working change, if one existed.
  optional ChangeVersion version = 3;
  optional bytes version_hash = 4;
}

message HandoffRequest {
  bytes operation_id = 1;
  string repo = 2;
  bytes workspace = 3;
  Principal to = 4;
}
message HandoffResponse {
  Workspace workspace = 1;
  Operation operation = 2;
}

message UndoRequest {
  bytes operation_id = 1;
  string repo = 2;
  bytes workspace = 3;
  // Operation to undo; defaults to the head operation.
  optional bytes target = 4;
}
message UndoResponse {
  Workspace workspace = 1;
  Operation operation = 2;
}

message ListOperationsRequest {
  string repo = 1;
  bytes workspace = 2;
  uint32 limit = 3;
  // Continue from this operation (exclusive), walking toward the root.
  optional bytes before = 4;
}
message ListOperationsResponse {
  repeated Operation operations = 1;
}

message DeleteWorkspaceRequest {
  bytes operation_id = 1;
  string repo = 2;
  bytes workspace = 3;
}
message DeleteWorkspaceResponse {}

message WorkspaceDiffRequest {
  string repo = 1;
  bytes workspace = 2;
  repeated string paths = 3;
  DiffFormat format = 4;
  uint32 context_lines = 5;
}
message WorkspaceDiffResponse {
  repeated FileDiff files = 1;
}
