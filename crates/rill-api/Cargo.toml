[package]
name = "rill-api"
description = "The Rill services: gRPC API, object HTTP protocol and background workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Keep metadata in FoundationDB. Needs the FoundationDB client library.
fdb = ["rill-store/fdb"]
# AWS KMS and Google Cloud KMS as token key services.
aws = ["rill-identity/aws"]
gcp = ["rill-identity/gcp"]
# SAML 2.0 sign-in. Needs libxml2 and xmlsec1.
saml = ["rill-identity/saml"]

[dependencies]
rill-types = { workspace = true }
rill-store = { workspace = true, features = ["s3"] }
rill-core = { workspace = true }
rill-policy = { workspace = true }
rill-proto = { workspace = true }
rill-review = { workspace = true }
rill-lander = { workspace = true }
rill-events = { workspace = true }
rill-jobs = { workspace = true }
rill-search = { workspace = true }
rill-exec = { workspace = true }
rill-identity = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
prometheus-client = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }

tonic = { workspace = true }
tonic-prost = { workspace = true }
tonic-reflection = { workspace = true }
tonic-health = { workspace = true }
prost = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
url = { workspace = true }

[dev-dependencies]
prost-types = { workspace = true }
rill-identity = { workspace = true, features = ["testing"] }
rill-store = { workspace = true, features = ["s3", "testing"] }
tempfile = { workspace = true }
