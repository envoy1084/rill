[package]
name = "rill-store"
description = "Storage traits and backends for Rill: content-addressed object store and transactional metadata store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["local"]
# Filesystem object store and redb metadata store.
local = ["dep:redb"]
# S3 and S3-compatible object storage.
s3 = ["object_store/aws"]
# FoundationDB metadata store. Needs the FoundationDB client library.
fdb = ["dep:foundationdb"]
# Hooks for crash and recovery tests.
testing = []

[dependencies]
rill-types = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
aes-gcm = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
zstd = { workspace = true }
redb = { workspace = true, optional = true }
foundationdb = { workspace = true, optional = true }
foundationdb-tuple = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
object_store = { workspace = true }
