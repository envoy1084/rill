# Lint and breaking-change rules for the protobuf API. Run from this
# directory: `buf lint`, and `buf generate --exclude-path proto/google` to
# regenerate the API reference.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
    - COMMENT_SERVICE
    - COMMENT_RPC
  ignore:
    - proto/google
breaking:
  use:
    - FILE
  ignore:
    - proto/google
