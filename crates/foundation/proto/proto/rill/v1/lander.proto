// Lander service: trunk status, post-land verification, culprits and reverts.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";
import "rill/v1/repo.proto";
import "rill/v1/review.proto";

service LanderService {
  rpc GetTrunkStatus(GetTrunkStatusRequest) returns (GetTrunkStatusResponse);
  rpc ListLandings(ListLandingsRequest) returns (ListLandingsResponse);
  rpc GetVerification(GetVerificationRequest) returns (GetVerificationResponse);
  rpc ReportVerification(ReportVerificationRequest) returns (ReportVerificationResponse);
  rpc RevertSeq(RevertSeqRequest) returns (RevertSeqResponse);
  rpc Bisect(BisectRequest) returns (BisectResponse);
  // Trunk's state and the incidents keeping it red.
  rpc GetTrunkHealth(GetTrunkHealthRequest) returns (GetTrunkHealthResponse);
  // Incidents, open and closed, newest culprit first.
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse);
  // Freeze trunk so only emergency landings land, or thaw it (owners).
  rpc FreezeTrunk(FreezeTrunkRequest) returns (FreezeTrunkResponse);
  // Revert every landing a session, model, sponsor, author or intent made
  // (owners): a preview of what would be reverted and which reverts
  // conflict, or with `apply` the reverts queued in the emergency lane.
  rpc RevertSet(RevertSetRequest) returns (RevertSetResponse);
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PENDING = 1;
  VERIFICATION_STATUS_RUNNING = 2;
  VERIFICATION_STATUS_PASSED = 3;
  VERIFICATION_STATUS_FAILED = 4;
  // Failed, and a later bisect found an earlier culprit.
  VERIFICATION_STATUS_INHERITED = 5;
  VERIFICATION_STATUS_SKIPPED = 6;
}

// One runner's report for one landed sequence.
message VerificationReport {
  // Name of the verification target or runner (`unit`, `lint`, ...).
  string target = 1;
  VerificationStatus status = 2;
  Principal reporter = 3;
  int64 reported_at = 4;
  optional string details = 5;
  // Content-addressed log or artifact, if the runner stored one.
  optional bytes artifact = 6;
}

message VerificationResult {
  uint64 seq = 1;
  VerificationStatus status = 2;
  // The sequence that introduced the failure, when known.
  optional uint64 culprit = 3;
  repeated VerificationReport reports = 4;
}

message GetTrunkStatusRequest {
  string repo = 1;
  uint32 recent_limit = 2;
}
message InFlightLanding {
  LandTicket ticket = 1;
  bytes version = 2;
}
message GetTrunkStatusResponse {
  uint64 head_seq = 1;
  bytes head_hash = 2;
  repeated InFlightLanding in_flight = 3;
  repeated LandEvent recent = 4;
  // Latest sequence whose verification has passed.
  optional uint64 last_verified_seq = 5;
}

message ListLandingsRequest {
  string repo = 1;
  uint32 limit = 2;
  optional uint64 before_seq = 3;
}
message ListLandingsResponse {
  repeated LandEvent landings = 1;
  repeated VerificationResult verifications = 2;
}

message GetVerificationRequest {
  string repo = 1;
  uint64 seq = 2;
}
message GetVerificationResponse {
  VerificationResult result = 1;
}

message ReportVerificationRequest {
  bytes operation_id = 1;
  string repo = 2;
  uint64 seq = 3;
  string target = 4;
  VerificationStatus status = 5;
  optional string details = 6;
  optional bytes artifact = 7;
}
message ReportVerificationResponse {
  VerificationResult result = 1;
}

message RevertSeqRequest {
  bytes operation_id = 1;
  string repo = 2;
  uint64 seq = 3;
  string reason = 4;
}
message RevertSeqResponse {
  LandEvent landing = 1;
  ChangeVersion version = 2;
}

message BisectRequest {
  bytes operation_id = 1;
  string repo = 2;
  // Last known-good sequence.
  uint64 from = 3;
  // First known-bad sequence.
  uint64 to = 4;
  string target = 5;
}
message BisectResponse {
  optional uint64 culprit = 1;
  // Sequences the bisect tested, with their outcomes.
  repeated VerificationResult tested = 2;
}

message TrunkHealth {
  // green, red, fixing or guarded.
  string state = 1;
  int64 since = 2;
  // Culprits of the open incidents.
  repeated uint64 open = 3;
  repeated string failing_steps = 4;
  bool frozen = 5;
  optional string frozen_reason = 6;
}

message Incident {
  uint64 culprit = 1;
  bytes version = 2;
  bytes change_id = 3;
  repeated string failures = 4;
  repeated string steps = 5;
  string details = 6;
  Principal author = 7;
  optional string session = 8;
  optional string model = 9;
  optional Principal sponsor = 10;
  // open, fixing or closed.
  string state = 11;
  int64 opened_at = 12;
  int64 updated_at = 13;
  // The landing that reverted or fixed it.
  optional uint64 fix = 14;
  // reverted, fixed or recovered, and at which position.
  optional string resolution = 15;
  optional uint64 resolved_at = 16;
  optional string revert_blocked = 17;
  optional string assigned = 18;
}

message GetTrunkHealthRequest {
  string repo = 1;
}
message GetTrunkHealthResponse {
  TrunkHealth health = 1;
  repeated Incident open = 2;
}
message ListIncidentsRequest {
  string repo = 1;
  // Default 20.
  uint32 limit = 2;
}
message ListIncidentsResponse {
  repeated Incident incidents = 1;
}
message FreezeTrunkRequest {
  bytes operation_id = 1;
  string repo = 2;
  bool frozen = 3;
  string reason = 4;
}
message FreezeTrunkResponse {
  TrunkHealth health = 1;
}

message RevertSetRequest {
  bytes operation_id = 1;
  string repo = 2;
  optional string session = 3;
  optional string model = 4;
  // By name (`ann`) or as shown (`agent:bot`).
  optional string sponsor = 5;
  optional string author = 6;
  optional bytes intent = 7;
  // Positions in (since, until]; all of trunk when absent.
  optional uint64 since = 8;
  optional uint64 until = 9;
  bool apply = 10;
  string reason = 11;
}
message RevertSetEntry {
  uint64 seq = 1;
  bytes change_id = 2;
  string summary = 3;
  // Previews: paths its revert conflicts at after the newer reverts.
  repeated string conflicts = 4;
  // Applied: the revert's land ticket.
  optional string ticket = 5;
}
message RevertSetResponse {
  // Newest first.
  repeated RevertSetEntry entries = 1;
}
