// Server-side workspaces: a principal's working copy of a repository, with
// an operation log that can be undone.
//
// A workspace is `orgs/{org}/repos/{repo}/workspaces/{workspace}`; an
// entry of its log is `…/workspaces/{workspace}/operations/{operation}`.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

// Workspaces and their operation logs.
service WorkspaceService {
  // Create a workspace on a base revision.
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  // A workspace by name.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  // A repository's workspaces.
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  // Change a workspace's sparse profile, if it still has the `etag` given.
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (UpdateWorkspaceResponse);
  // Delete a workspace, if it still has the `etag` given.
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
  // Record the working copy's tree.
  rpc SnapshotWorkspace(SnapshotWorkspaceRequest) returns (SnapshotWorkspaceResponse);
  // Turn the snapshot into a version of the working change.
  rpc StartChange(StartChangeRequest) returns (StartChangeResponse);
  // Move the workspace to a new base, rebasing its working change.
  rpc SyncWorkspace(SyncWorkspaceRequest) returns (SyncWorkspaceResponse);
  // Give the workspace to another principal.
  rpc HandoffWorkspace(HandoffWorkspaceRequest) returns (HandoffWorkspaceResponse);
  // Restore the workspace to before an operation.
  rpc UndoOperation(UndoOperationRequest) returns (UndoOperationResponse);
  // A workspace's operation log, newest first.
  rpc ListWorkspaceOperations(ListWorkspaceOperationsRequest) returns (ListWorkspaceOperationsResponse);
  // The difference between the snapshot and the base.
  rpc DiffWorkspace(DiffWorkspaceRequest) returns (DiffWorkspaceResponse);
}

message CreateWorkspaceRequest {
  string request_id = 1;
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 2;
  // `display_name` and `sparse` are read; the rest is output only.
  Workspace workspace = 3;
  // A revision; trunk when empty.
  string base = 4;
}
message CreateWorkspaceResponse {
  Workspace workspace = 1;
  WorkspaceOperation operation = 2;
}

message GetWorkspaceRequest {
  // `…/workspaces/{workspace}`. Required.
  string name = 1;
}
message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message ListWorkspacesRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // On `owner` (a principal, `ann` or `agent:bot`) and `display_name`.
  string filter = 4;
}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  string next_page_token = 2;
}

message UpdateWorkspaceRequest {
  string request_id = 1;
  // `name` and `sparse` are read. Required.
  Workspace workspace = 2;
  // The workspace's current etag. Required.
  string etag = 3;
}
message UpdateWorkspaceResponse {
  Workspace workspace = 1;
  WorkspaceOperation operation = 2;
}

message DeleteWorkspaceRequest {
  string request_id = 1;
  // `…/workspaces/{workspace}`. Required.
  string name = 2;
  // The workspace's current etag; any when empty.
  string etag = 3;
}
message DeleteWorkspaceResponse {}

message SnapshotWorkspaceRequest {
  string request_id = 1;
  // `…/workspaces/{workspace}`. Required.
  string name = 2;
  // Root tree of the working copy; its objects must already be uploaded.
  bytes tree_hash = 3;
}
message SnapshotWorkspaceResponse {
  WorkspaceOperation operation = 1;
}

message StartChangeRequest {
  string request_id = 1;
  // `…/workspaces/{workspace}`. Required.
  string name = 2;
  string message = 3;
  // `orgs/{org}/repos/{repo}/intents/{intent}`.
  string intent = 4;
  Provenance provenance = 5;
}
message StartChangeResponse {
  // `…/changes/{change}`.
  string change = 1;
  ChangeInfo info = 2;
  ChangeVersion version = 3;
  WorkspaceOperation operation = 4;
}

message SyncWorkspaceRequest {
  string request_id = 1;
  // `…/workspaces/{workspace}`. Required.
  string name = 2;
  // A revision; trunk when empty.
  string base = 3;
}
message SyncWorkspaceResponse {
  Workspace workspace = 1;
  WorkspaceOperation operation = 2;
  // The rebased working change, if one existed.
  ChangeInfo info = 3;
  ChangeVersion version = 4;
}

message HandoffWorkspaceRequest {
  string request_id = 1;
  // `…/workspaces/{workspace}`. Required.
  string name = 2;
  // Required.
  Principal to = 3;
}
message HandoffWorkspaceResponse {
  Workspace workspace = 1;
  WorkspaceOperation operation = 2;
}

message UndoOperationRequest {
  string request_id = 1;
  // The operation to undo: `…/workspaces/{workspace}/operations/{operation}`,
  // or `…/workspaces/{workspace}/operations/head`. Required.
  string name = 2;
}
message UndoOperationResponse {
  Workspace workspace = 1;
  WorkspaceOperation operation = 2;
}

message ListWorkspaceOperationsRequest {
  // `…/workspaces/{workspace}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListWorkspaceOperationsResponse {
  // Newest first.
  repeated WorkspaceOperation operations = 1;
  string next_page_token = 2;
}

message DiffWorkspaceRequest {
  // `…/workspaces/{workspace}`. Required.
  string name = 1;
  repeated string paths = 2;
  DiffFormat format = 3;
  uint32 context_lines = 4;
}
message DiffWorkspaceResponse {
  repeated FileDiff files = 1;
}
