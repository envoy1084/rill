// Checks: what verification ran, test by test, and which targets are
// quarantined.
//
// A run is `orgs/{org}/repos/{repo}/runs/{run}`; a quarantine is
// `orgs/{org}/repos/{repo}/quarantines/{target}`.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

// Verification runs, test history, flakes and quarantines.
service ChecksService {
  // Recent runs of a step or test, newest first, with its flake stats.
  rpc GetTestHistory(GetTestHistoryRequest) returns (GetTestHistoryResponse);
  // Targets whose outcome changes on unchanged inputs, flakiest first.
  rpc ListFlakyTests(ListFlakyTestsRequest) returns (ListFlakyTestsResponse);
  // Verification runs, newest first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // One run with its steps.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // The run now and after every change, until it ends.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
  // A byte range of a step's standard output or error.
  rpc ReadLog(ReadLogRequest) returns (ReadLogResponse);
  // A byte range of a file a step produced.
  rpc ReadArtifact(ReadArtifactRequest) returns (ReadArtifactResponse);
  // Steps a hermeticity probe caught giving different outputs on a re-run;
  // they run uncached until the flag expires.
  rpc ListNonhermeticSteps(ListNonhermeticStepsRequest) returns (ListNonhermeticStepsResponse);
  // Targets whose failures neither block landings nor make trunk red.
  rpc ListQuarantines(ListQuarantinesRequest) returns (ListQuarantinesResponse);
  // Quarantine a step or test (repository owners).
  rpc CreateQuarantine(CreateQuarantineRequest) returns (CreateQuarantineResponse);
  // Lift a quarantine (repository owners).
  rpc DeleteQuarantine(DeleteQuarantineRequest) returns (DeleteQuarantineResponse);
}

// A target whose failures are not held against changes.
message Quarantine {
  // `…/quarantines/{target}`. Output only.
  string name = 6;
  // `step:<name>[#shard]` or `test:<id>`. Required on create.
  string target = 1;
  // Output only.
  int64 since = 2;
  // Output only.
  Principal by = 3;
  string reason = 4;
  // The intent tracking the fix, when one was opened. Output only.
  optional bytes intent = 5;
}

message ListQuarantinesRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListQuarantinesResponse {
  repeated Quarantine quarantines = 1;
  string next_page_token = 2;
}

message CreateQuarantineRequest {
  string request_id = 1;
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 2;
  // Required.
  Quarantine quarantine = 3;
}
message CreateQuarantineResponse {
  Quarantine quarantine = 1;
}

message DeleteQuarantineRequest {
  string request_id = 1;
  // `…/quarantines/{target}`. Required.
  string name = 2;
}
message DeleteQuarantineResponse {}

message NonhermeticStep {
  string step = 1;
  // The action whose two runs differed.
  bytes action = 2;
  repeated string differences = 3;
  int64 found_at = 4;
  int64 until = 5;
}

message ListNonhermeticStepsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListNonhermeticStepsResponse {
  repeated NonhermeticStep steps = 1;
  string next_page_token = 2;
}

enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  STEP_STATE_QUEUED = 1;
  STEP_STATE_RUNNING = 2;
  STEP_STATE_PASSED = 3;
  STEP_STATE_FAILED = 4;
  STEP_STATE_TIMED_OUT = 5;
  // It could not run.
  STEP_STATE_ERROR = 6;
  // Not run: the change touched none of its inputs.
  STEP_STATE_UNAFFECTED = 7;
  // Not run: it does not gate the change's risk class.
  STEP_STATE_NOT_GATING = 8;
}

message Artifact {
  string path = 1;
  uint64 size = 2;
}

message RunStep {
  // Its index in the run, for ReadLog and ReadArtifact.
  uint32 index = 1;
  string name = 2;
  // 1-based shard and shard count, 0 when not sharded.
  uint32 shard = 3;
  uint32 shards = 4;
  StepState state = 5;
  optional int32 exit_code = 6;
  // Why it could not run.
  string error = 7;
  bool cached = 8;
  uint64 stdout_size = 9;
  uint64 stderr_size = 10;
  repeated Artifact artifacts = 11;
  string worker = 12;
  optional uint64 duration_ms = 13;
  // It ran uncached: a probe found it non-hermetic.
  bool nonhermetic = 14;
}

message VerifyRun {
  // `…/runs/{run}`.
  string name = 9;
  string id = 1;
  bytes version = 2;
  // Verification of trunk, after landing.
  bool trunk = 3;
  int64 started_at = 4;
  // Unset while it runs.
  optional bool green = 5;
  string summary = 6;
  optional int64 finished_at = 7;
  // Empty in listings.
  repeated RunStep steps = 8;
}

message ListRunsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Only runs of this version, `…/versions/{hash}`.
  string version = 4;
}
message ListRunsResponse {
  repeated VerifyRun runs = 1;
  string next_page_token = 2;
}

message GetRunRequest {
  // `…/runs/{run}`. Required.
  string name = 1;
}
message GetRunResponse {
  VerifyRun run = 1;
}

message WatchRunRequest {
  // `…/runs/{run}`. Required.
  string name = 1;
}
message WatchRunResponse {
  VerifyRun run = 1;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

message ReadLogRequest {
  // `…/runs/{run}`. Required.
  string run = 1;
  uint32 step = 2;
  LogStream stream = 3;
  // A negative offset counts from the end: -4096 is the last 4 KiB.
  int64 offset = 4;
  // Default and most 1 MiB.
  uint32 limit = 5;
}
message ReadLogResponse {
  bytes data = 1;
  // Where `data` starts, and the whole size.
  uint64 offset = 2;
  uint64 size = 3;
}

message ReadArtifactRequest {
  // `…/runs/{run}`. Required.
  string run = 1;
  uint32 step = 2;
  string path = 3;
  int64 offset = 4;
  uint32 limit = 5;
}
message ReadArtifactResponse {
  bytes data = 1;
  uint64 offset = 2;
  uint64 size = 3;
}

enum TestOutcome {
  TEST_OUTCOME_UNSPECIFIED = 0;
  TEST_OUTCOME_PASSED = 1;
  TEST_OUTCOME_FAILED = 2;
  TEST_OUTCOME_SKIPPED = 3;
  // It could not run; says nothing about the test.
  TEST_OUTCOME_ERROR = 4;
}

message TestRun {
  // `step:<name>[#i/n]` or `test:<class>::<name>`.
  string target = 1;
  TestOutcome outcome = 2;
  // The test runner retried it before it passed.
  bool retried = 3;
  optional uint64 duration_ms = 4;
  // The action it ran in; the same action means the same inputs.
  bytes action = 5;
  string worker = 6;
  bytes version = 7;
  // Verified after landing.
  bool trunk = 8;
  int64 at = 9;
}

message GetTestHistoryRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  // Required.
  string target = 2;
  // Default 50, at most 100.
  int32 max_results = 3;
}
message GetTestHistoryResponse {
  repeated TestRun runs = 1;
  FlakyTest stats = 2;
}

message FlakyTest {
  string target = 1;
  // 0 to 1: the decayed rate of changed outcomes on unchanged inputs.
  double score = 2;
  double runs = 3;
  double failures = 4;
  double flips = 5;
  TestOutcome last = 6;
}

message ListFlakyTestsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // Default 0.1.
  optional double min_score = 4;
}
message ListFlakyTestsResponse {
  repeated FlakyTest tests = 1;
  string next_page_token = 2;
}
