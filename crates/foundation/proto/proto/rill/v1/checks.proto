// Checks service: what verification ran, test by test.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

service ChecksService {
  // Recent runs of a step or test, newest first.
  rpc GetTestHistory(GetTestHistoryRequest) returns (GetTestHistoryResponse);
  // Targets whose outcome changes on unchanged inputs, flakiest first.
  rpc ListFlakyTests(ListFlakyTestsRequest) returns (ListFlakyTestsResponse);
  // Verification runs, newest first, all or of one version.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (VerifyRun);
  // The run now and after every change, until it ends.
  rpc WatchRun(GetRunRequest) returns (stream VerifyRun);
  // A byte range of a step's standard output or error.
  rpc ReadLog(ReadLogRequest) returns (ReadBytesResponse);
  // A byte range of a file a step produced.
  rpc ReadArtifact(ReadArtifactRequest) returns (ReadBytesResponse);
  // Steps a hermeticity probe caught giving different outputs on a re-run;
  // they run uncached until the flag expires.
  rpc ListNonhermetic(ListNonhermeticRequest) returns (ListNonhermeticResponse);
  // Targets whose failures neither block landings nor make trunk red.
  rpc ListQuarantined(ListQuarantinedRequest) returns (ListQuarantinedResponse);
  // Quarantine a step or test (repository owners).
  rpc Quarantine(QuarantineRequest) returns (QuarantineResponse);
  // Lift a quarantine (repository owners).
  rpc ReleaseQuarantine(ReleaseQuarantineRequest) returns (ReleaseQuarantineResponse);
}

message QuarantinedTarget {
  // `step:<name>[#shard]` or `test:<id>`.
  string target = 1;
  int64 since = 2;
  Principal by = 3;
  string reason = 4;
  // The intent tracking the fix, when one was opened.
  optional bytes intent = 5;
}
message ListQuarantinedRequest {
  string repo = 1;
}
message ListQuarantinedResponse {
  repeated QuarantinedTarget targets = 1;
}
message QuarantineRequest {
  bytes operation_id = 1;
  string repo = 2;
  string target = 3;
  string reason = 4;
}
message QuarantineResponse {
  // False when it was already quarantined.
  bool added = 1;
}
message ReleaseQuarantineRequest {
  bytes operation_id = 1;
  string repo = 2;
  string target = 3;
}
message ReleaseQuarantineResponse {
  // False when it was not quarantined.
  bool released = 1;
}

message NonhermeticStep {
  string step = 1;
  // The action whose two runs differed.
  bytes action = 2;
  repeated string differences = 3;
  int64 found_at = 4;
  int64 until = 5;
}

message ListNonhermeticRequest {
  string repo = 1;
}
message ListNonhermeticResponse {
  repeated NonhermeticStep steps = 1;
}

enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  STEP_STATE_QUEUED = 1;
  STEP_STATE_RUNNING = 2;
  STEP_STATE_PASSED = 3;
  STEP_STATE_FAILED = 4;
  STEP_STATE_TIMED_OUT = 5;
  // It could not run.
  STEP_STATE_ERROR = 6;
  // Not run: the change touched none of its inputs.
  STEP_STATE_UNAFFECTED = 7;
  // Not run: it does not gate the change's risk class.
  STEP_STATE_NOT_GATING = 8;
}

message Artifact {
  string path = 1;
  uint64 size = 2;
}

message RunStep {
  // Its index in the run, for ReadLog and ReadArtifact.
  uint32 index = 1;
  string name = 2;
  // 1-based shard and shard count, 0 when not sharded.
  uint32 shard = 3;
  uint32 shards = 4;
  StepState state = 5;
  optional int32 exit_code = 6;
  // Why it could not run.
  string error = 7;
  bool cached = 8;
  uint64 stdout_size = 9;
  uint64 stderr_size = 10;
  repeated Artifact artifacts = 11;
  string worker = 12;
  optional uint64 duration_ms = 13;
  // It ran uncached: a probe found it non-hermetic.
  bool nonhermetic = 14;
}

message VerifyRun {
  string id = 1;
  bytes version = 2;
  // Verification of trunk, after landing.
  bool trunk = 3;
  int64 started_at = 4;
  // Unset while it runs.
  optional bool green = 5;
  string summary = 6;
  optional int64 finished_at = 7;
  // Empty in listings.
  repeated RunStep steps = 8;
}

message ListRunsRequest {
  string repo = 1;
  // Only runs of this version.
  bytes version = 2;
  // Default 20.
  uint32 limit = 3;
}
message ListRunsResponse {
  repeated VerifyRun runs = 1;
}

message GetRunRequest {
  string repo = 1;
  string run = 2;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

message ReadLogRequest {
  string repo = 1;
  string run = 2;
  uint32 step = 3;
  LogStream stream = 4;
  // A negative offset counts from the end: -4096 is the last 4 KiB.
  int64 offset = 5;
  // Default and most 1 MiB.
  uint32 limit = 6;
}

message ReadArtifactRequest {
  string repo = 1;
  string run = 2;
  uint32 step = 3;
  string path = 4;
  int64 offset = 5;
  uint32 limit = 6;
}

message ReadBytesResponse {
  bytes data = 1;
  // Where `data` starts, and the whole size.
  uint64 offset = 2;
  uint64 size = 3;
}

enum TestOutcome {
  TEST_OUTCOME_UNSPECIFIED = 0;
  TEST_OUTCOME_PASSED = 1;
  TEST_OUTCOME_FAILED = 2;
  TEST_OUTCOME_SKIPPED = 3;
  // It could not run; says nothing about the test.
  TEST_OUTCOME_ERROR = 4;
}

message TestRun {
  // `step:<name>[#i/n]` or `test:<class>::<name>`.
  string target = 1;
  TestOutcome outcome = 2;
  // The test runner retried it before it passed.
  bool retried = 3;
  optional uint64 duration_ms = 4;
  // The action it ran in; the same action means the same inputs.
  bytes action = 5;
  string worker = 6;
  bytes version = 7;
  // Verified after landing.
  bool trunk = 8;
  int64 at = 9;
}

message GetTestHistoryRequest {
  string repo = 1;
  string target = 2;
  // Default 50, at most 100.
  uint32 limit = 3;
}
message GetTestHistoryResponse {
  repeated TestRun runs = 1;
  FlakyTest stats = 2;
}

message FlakyTest {
  string target = 1;
  // 0 to 1: the decayed rate of changed outcomes on unchanged inputs.
  double score = 2;
  double runs = 3;
  double failures = 4;
  double flips = 5;
  TestOutcome last = 6;
}

message ListFlakyTestsRequest {
  string repo = 1;
  // Default 0.1.
  optional double min_score = 2;
  // Default 50.
  uint32 limit = 3;
}
message ListFlakyTestsResponse {
  repeated FlakyTest tests = 1;
}
