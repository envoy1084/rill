// Signing in: exchanging a provider's token for a session, and refreshing
// it. Open: callers have no token yet, and each RPC checks what it is
// given.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

// Signing in.
service SessionService {
  // The organization's providers a client can sign in through, with the
  // endpoints of their device flow.
  rpc ListSignInProviders(ListSignInProvidersRequest) returns (ListSignInProvidersResponse);
  // RFC 8693: a provider's ID token for a session.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);
  // A refresh token for a new access token and a new refresh token.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
}

message ListSignInProvidersRequest {
  // `orgs/{org}`. Required.
  string parent = 1;
}
message SignInProvider {
  string org = 1;
  string name = 2;
  string issuer = 3;
  optional string cli_client_id = 4;
  repeated string scopes = 5;
  optional string device_authorization_endpoint = 6;
  optional string token_endpoint = 7;
}
message ListSignInProvidersResponse {
  repeated SignInProvider providers = 1;
}

message ExchangeTokenRequest {
  string subject_token = 1;
  // `urn:ietf:params:oauth:token-type:id_token` (a person), or
  // `urn:ietf:params:oauth:token-type:jwt` (a workload, for an agent).
  string subject_token_type = 2;
  // For workloads: the org whose trusted issuer signed the JWT.
  string org = 3;
  // For workloads: the agent, when several bindings match.
  optional string agent = 4;
  // For workloads: the model the agent runs as.
  optional string model = 5;
}

message ExchangeTokenResponse {
  SessionGrant grant = 1;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}
message RefreshSessionResponse {
  SessionGrant grant = 1;
}

message SessionGrant {
  string access_token = 1;
  int64 expires_at = 2;
  optional string refresh_token = 3;
  string session = 4;
  Principal principal = 5;
  string org = 6;
}
