// Access: the relationship tuples that say who may do what in a
// repository, and questions about them.
//
// Responses carry the repository's relation version after the call.
// Clients send versions they have seen in the `x-rill-relations` header
// (`rp_<hex>=<version>`, comma separated); checks on that repository then
// reflect at least that version on every server.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

// Relation tuples and access checks.
service AccessService {
  // Grant a relation (repository owners).
  rpc CreateRelation(CreateRelationRequest) returns (CreateRelationResponse);
  // Take a relation back (repository owners).
  rpc DeleteRelation(DeleteRelationRequest) returns (DeleteRelationResponse);
  // A repository's tuples.
  rpc ListRelations(ListRelationsRequest) returns (ListRelationsResponse);
  // Whether a subject holds a relation on a path, and which tuples say so.
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
  // Every tuple that grants a relation on a path, with team members.
  rpc ExpandAccess(ExpandAccessRequest) returns (ExpandAccessResponse);
  // The directories a subject holds a relation on.
  rpc LookupPaths(LookupPathsRequest) returns (LookupPathsResponse);
}

// A ReBAC tuple: `subject` holds `relation` on `path` (the whole
// repository when empty).
message Relation {
  string path = 1;
  // `owner`, `writer`, `reviewer` or `reader`; each implies the next.
  string relation = 2;
  // `user:<name>`, `agent:<name>`, `team:<name>`, `kind:<human|agent|service>`,
  // `principal:pr_<hex>` or `*`. Users and agents are stored by principal id.
  string subject = 3;
}

message CreateRelationRequest {
  string request_id = 1;
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 2;
  // Required.
  Relation relation = 3;
}
message CreateRelationResponse {
  // The repository's uid (`rp_…`), for `x-rill-relations`.
  string repo_uid = 1;
  int64 relation_version = 2;
}

message DeleteRelationRequest {
  string request_id = 1;
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 2;
  // Required.
  Relation relation = 3;
}
message DeleteRelationResponse {
  string repo_uid = 1;
  int64 relation_version = 2;
}

message ListRelationsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // On `path`, `subject` and `relation`.
  string filter = 4;
}
message ListRelationsResponse {
  repeated Relation relations = 1;
  int64 relation_version = 2;
  string next_page_token = 3;
}

message CheckAccessRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  string path = 2;
  // Required.
  string relation = 3;
  // `user:<name>` or `agent:<name>`; the caller when absent. Asking about
  // anyone else needs owner.
  optional string subject = 4;
}
message CheckAccessResponse {
  bool allowed = 1;
  // The tuples that grant it, nearest directory first.
  repeated Relation because = 2;
  // Allowed as an administrator of the repository's organization.
  bool org_admin = 3;
  int64 relation_version = 4;
}

message ExpandAccessRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  string path = 2;
  // Required.
  string relation = 3;
}
message ExpandedTuple {
  Relation tuple = 1;
  // For a team subject, the org's active users in the team.
  repeated Principal members = 2;
}
message ExpandAccessResponse {
  repeated ExpandedTuple tuples = 1;
  int64 relation_version = 2;
}

message LookupPathsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  // Required.
  string relation = 2;
  // As in CheckAccessRequest.
  optional string subject = 3;
}
message LookupPathsResponse {
  // Directories (each with its subtree); `""` is the whole repository.
  repeated string paths = 1;
  int64 relation_version = 2;
}
