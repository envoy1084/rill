// Intents: the "why" behind changes.
//
// An intent is `orgs/{org}/repos/{repo}/intents/{intent}`.
syntax = "proto3";

package rill.v1;

import "google/protobuf/field_mask.proto";
import "rill/v1/types.proto";

// Intents and the changes linked to them.
service IntentService {
  // Record a new intent.
  rpc CreateIntent(CreateIntentRequest) returns (CreateIntentResponse);
  // One intent.
  rpc GetIntent(GetIntentRequest) returns (GetIntentResponse);
  // Change an intent's title, body, status, parent, risk override or
  // scope. Changing the scope starts a new revision, which needs approving.
  rpc UpdateIntent(UpdateIntentRequest) returns (UpdateIntentResponse);
  // A repository's intents, most recently updated first.
  rpc ListIntents(ListIntentsRequest) returns (ListIntentsResponse);
  // Link a change to an intent, on both the intent and the change's review.
  rpc LinkChange(LinkChangeRequest) returns (LinkChangeResponse);
  // Intents whose words overlap a title and body, best first.
  rpc FindSimilarIntents(FindSimilarIntentsRequest) returns (FindSimilarIntentsResponse);
  // Approve the intent's current scope revision, for the scope directories
  // the caller owns.
  rpc ApproveIntent(ApproveIntentRequest) returns (ApproveIntentResponse);
  // Withdraw the caller's approval.
  rpc RevokeIntentApproval(RevokeIntentApprovalRequest) returns (RevokeIntentApprovalResponse);
  // Whether a change's intent is approved and the change inside its scope.
  rpc ExplainIntentScope(ExplainIntentScopeRequest) returns (ExplainIntentScopeResponse);
}

message CreateIntentRequest {
  string request_id = 1;
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 2;
  // Required.
  string title = 3;
  string body = 4;
  IntentKind kind = 5;
  // The parent intent, `…/intents/{intent}`.
  string parent_intent = 6;
  optional RiskClass risk_override = 7;
  // The scope to approve; unset for none.
  IntentScope scope = 8;
}
message CreateIntentResponse {
  Intent intent = 1;
}

message GetIntentRequest {
  // `…/intents/{intent}`. Required.
  string name = 1;
}
message GetIntentResponse {
  Intent intent = 1;
}

message UpdateIntentRequest {
  string request_id = 1;
  // The intent, by `name`, with the fields to change. Required.
  Intent intent = 2;
  // Which of `title`, `body`, `status`, `parent`, `risk_override` and
  // `scope` to change; a masked field left empty is cleared. Required.
  google.protobuf.FieldMask update_mask = 3;
  // The etag read; empty means no condition.
  string etag = 4;
}
message UpdateIntentResponse {
  Intent intent = 1;
}

message ListIntentsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // On `status` (`open`, `in_progress`, `done`, `abandoned`), `kind`
  // (`feature`, `bug`, `refactor`, `chore`, `experiment`, `system`), `owner` (`ann`) and `parent` (an intent id).
  string filter = 4;
}
message ListIntentsResponse {
  repeated Intent intents = 1;
  string next_page_token = 2;
}

message LinkChangeRequest {
  string request_id = 1;
  // `…/intents/{intent}`. Required.
  string name = 2;
  // `…/changes/{change}`. Required.
  string change = 3;
}
message LinkChangeResponse {
  Intent intent = 1;
}

message FindSimilarIntentsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  string title = 2;
  string body = 3;
  // Default 10, at most 100.
  int32 max_results = 4;
}
message ScoredIntent {
  Intent intent = 1;
  float score = 2;
}
message FindSimilarIntentsResponse {
  repeated ScoredIntent results = 1;
}

message ApproveIntentRequest {
  string request_id = 1;
  // `…/intents/{intent}`. Required.
  string name = 2;
  // The revision being approved; refused when it is not current.
  uint32 revision = 3;
}
message ApproveIntentResponse {
  Intent intent = 1;
}

message RevokeIntentApprovalRequest {
  string request_id = 1;
  // `…/intents/{intent}`. Required.
  string name = 2;
}
message RevokeIntentApprovalResponse {
  Intent intent = 1;
}

message ExplainIntentScopeRequest {
  // `…/changes/{change}`. Required.
  string change = 1;
}
message ExplainIntentScopeResponse {
  // The linked intent, `…/intents/{intent}`; empty when there is none.
  string intent = 1;
  bool approved = 2;
  bool in_scope = 3;
  // Why the change is not in scope.
  repeated string reasons = 4;
  // Scope directories still short of approvals.
  repeated string missing_approvals = 5;
}
