// Identity: who the caller is, tokens and their keys, and each
// organization's identity providers, users, agents, workload issuers and
// SCIM credentials.
//
// Organization resources: `orgs/{org}/identityProviders/{provider}`,
// `orgs/{org}/users/{user}`, `orgs/{org}/agents/{agent}`,
// `orgs/{org}/workloadIssuers/{issuer}`,
// `orgs/{org}/scimCredentials/{credential}`.
syntax = "proto3";

package rill.v1;

import "google/protobuf/field_mask.proto";
import "rill/v1/types.proto";

// Identities, tokens and the organization's sign-in setup.
service IdentityService {
  // The caller: principal, teams, capabilities and token.
  rpc GetCaller(GetCallerRequest) returns (GetCallerResponse);
  // Mint a capability token attenuated from the caller's.
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
  // Revoke a token (and every token attenuated from it). Callers may
  // revoke a token they present; administrators any token id.
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  // End a session; every token issued under it is refused from then on.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Store a new signing key now; it activates after the activation delay.
  rpc RotateTokenKeys(RotateTokenKeysRequest) returns (RotateTokenKeysResponse);
  // The token signing keys, active and retired.
  rpc ListTokenKeys(ListTokenKeysRequest) returns (ListTokenKeysResponse);

  // One OpenID Connect or SAML provider; org administrators.
  rpc GetIdentityProvider(GetIdentityProviderRequest) returns (GetIdentityProviderResponse);
  // An organization's identity providers; org administrators.
  rpc ListIdentityProviders(ListIdentityProvidersRequest) returns (ListIdentityProvidersResponse);
  // Replace a provider, or with `allow_missing` create it; org
  // administrators.
  rpc UpdateIdentityProvider(UpdateIdentityProviderRequest) returns (UpdateIdentityProviderResponse);
  // Remove a provider; org administrators.
  rpc DeleteIdentityProvider(DeleteIdentityProviderRequest) returns (DeleteIdentityProviderResponse);

  // An organization's users; org administrators.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Suspend or reactivate a user, or set their roles. Suspension refuses
  // every token the user holds at once.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // Register an agent: org administrators, or a user for agents they
  // sponsor.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  // One agent.
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  // An organization's agents.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Suspend or reactivate an agent, or replace its registration.
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);

  // Issuers whose workload JWTs may be exchanged for agent tokens; org
  // administrators.
  rpc ListWorkloadIssuers(ListWorkloadIssuersRequest) returns (ListWorkloadIssuersResponse);
  // Replace an issuer, or with `allow_missing` create it.
  rpc UpdateWorkloadIssuer(UpdateWorkloadIssuerRequest) returns (UpdateWorkloadIssuerResponse);
  // Remove an issuer.
  rpc DeleteWorkloadIssuer(DeleteWorkloadIssuerRequest) returns (DeleteWorkloadIssuerResponse);

  // Stop an agent, a session, everything a sponsor's agents do, or every
  // agent running as a model; org administrators. Tokens are refused at
  // once, and the lander ejects their queued work.
  rpc KillSwitch(KillSwitchRequest) returns (KillSwitchResponse);

  // Bearer credentials a provisioning system calls the org's SCIM endpoint
  // (`/scim/v2/<org>`) with; org administrators. The secret is returned
  // once.
  rpc CreateScimCredential(CreateScimCredentialRequest) returns (CreateScimCredentialResponse);
  // An organization's SCIM credentials, revoked ones included.
  rpc ListScimCredentials(ListScimCredentialsRequest) returns (ListScimCredentialsResponse);
  // Revoke a SCIM credential; it stays listed as revoked.
  rpc DeleteScimCredential(DeleteScimCredentialRequest) returns (DeleteScimCredentialResponse);
}

message GetCallerRequest {}

// A capability the caller's token grants, as a human-readable summary.
message Capability {
  // Action name, e.g. `repo.write`, `review.vote`, `lander.land`.
  string action = 1;
  // Object pattern the action applies to, e.g. `repo:main/*`.
  string scope = 2;
  optional int64 expires_at = 3;
}

message GetCallerResponse {
  Principal principal = 1;
  repeated string teams = 2;
  repeated Capability capabilities = 3;
  optional int64 token_expires_at = 4;
  // The caller's token id (`tk_…`), session (`ss_…`) and organization,
  // when the caller presented an issued token.
  optional string token_id = 5;
  optional string session = 6;
  optional string org = 7;
  optional string sponsor = 8;
  optional string model = 9;
}

message IssueTokenRequest {
  string request_id = 1;
  // Capabilities to attenuate the caller's token to; must be a subset.
  repeated Capability capabilities = 2;
  optional int64 expires_at = 3;
  // Principal the token acts as; defaults to the caller. Used to mint
  // agent identities sponsored by the caller.
  optional Principal for_principal = 4;
}
message IssueTokenResponse {
  string token = 1;
  int64 expires_at = 2;
}

message ScimCredential {
  // `orgs/{org}/scimCredentials/{credential}`.
  string name = 6;
  string org = 1;
  string id = 2;
  Principal created_by = 3;
  int64 created_at = 4;
  optional int64 revoked_at = 5;
}
message CreateScimCredentialRequest {
  string request_id = 1;
  // `orgs/{org}`. Required.
  string parent = 2;
}
message CreateScimCredentialResponse {
  ScimCredential credential = 1;
  // The bearer token to give the provisioning system; not stored.
  string token = 2;
}
message ListScimCredentialsRequest {
  // `orgs/{org}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListScimCredentialsResponse {
  repeated ScimCredential credentials = 1;
  string next_page_token = 2;
}
message DeleteScimCredentialRequest {
  string request_id = 1;
  // `orgs/{org}/scimCredentials/{credential}`. Required.
  string name = 2;
}
message DeleteScimCredentialResponse {}

message KillSwitchRequest {
  string request_id = 1;
  // `orgs/{org}`. Required.
  string parent = 2;
  oneof target {
    string agent = 3;
    // `ss_…`
    string session = 4;
    // `user:<name>` or `team:<name>`.
    string sponsor = 5;
    string model = 6;
  }
  string reason = 7;
}
message KillSwitchResponse {
  repeated string agents_suspended = 1;
  repeated string sessions_revoked = 2;
  repeated string models_blocked = 3;
}

message AgentBudgets {
  optional uint64 versions_per_day = 1;
  optional uint64 lands_per_day = 2;
  optional uint64 requests_per_minute = 3;
  optional uint64 executions_per_day = 4;
}

message WorkloadBinding {
  string issuer = 1;
  // The `sub` claim; a trailing `*` matches any suffix.
  string subject = 2;
  // Further claims that must equal these values.
  map<string, string> claims = 3;
}

message AgentSpec {
  string org = 1;
  string name = 2;
  // `user:<name>` or `team:<name>`.
  string sponsor = 3;
  string purpose = 4;
  // Repository names in the org; `*` for all.
  repeated string repos = 5;
  // Path prefixes; empty for every path.
  repeated string paths = 6;
  // Models it may run as; empty for any.
  repeated string models = 7;
  AgentBudgets budgets = 8;
  repeated WorkloadBinding workloads = 9;
  optional int64 expires_at = 10;
  // Set when the agent reviews changes.
  ReviewerProfile reviewer = 11;
}

// How an agent reviews.
message ReviewerProfile {
  // The model's family (`claude`, …); a quorum needs different families
  // or prompts.
  string model_family = 1;
  string model = 2;
  // Its prompt's repository path; default `.rill/reviewers/<name>/prompt.md`.
  string prompt = 3;
  // The largest `Review` vote it may cast, either way (1 or 2).
  int32 max_vote = 4;
  optional uint64 runs_per_day = 5;
}

message Agent {
  // `orgs/{org}/agents/{agent}`. Output only.
  string name = 7;
  // Output only.
  string etag = 8;
  AgentSpec spec = 1;
  Principal principal = 2;
  // `active` or `suspended`.
  string status = 3;
  Principal created_by = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message CreateAgentRequest {
  string request_id = 1;
  // `orgs/{org}`. Required.
  string parent = 2;
  // The registration; its org and name are the new agent's. Required.
  AgentSpec agent = 3;
}
message CreateAgentResponse {
  Agent agent = 1;
}
message GetAgentRequest {
  // `orgs/{org}/agents/{agent}`. Required.
  string name = 1;
}
message GetAgentResponse {
  Agent agent = 1;
}
message ListAgentsRequest {
  // `orgs/{org}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // On `status` (`active`, `suspended`) and `sponsor`.
  string filter = 4;
}
message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
}
message UpdateAgentRequest {
  string request_id = 1;
  // The agent, by `name`, with the fields to change. Required.
  Agent agent = 2;
  // `status` (`active` or `suspended`) and/or `spec`, which replaces the
  // registration's sponsor, scope, models, budgets, bindings and expiry;
  // its org and name must match. Required.
  google.protobuf.FieldMask update_mask = 3;
  // The etag read; empty means no condition.
  string etag = 4;
}
message UpdateAgentResponse {
  Agent agent = 1;
}

message WorkloadIssuerSpec {
  // `orgs/{org}/workloadIssuers/{issuer}`. Output only.
  string resource_name = 8;
  string org = 1;
  string name = 2;
  string issuer = 3;
  oneof keys {
    // OIDC discovery at the issuer.
    bool discovery = 4;
    string jwks_uri = 5;
    // A JWKS document.
    string jwks = 6;
  }
  repeated string audiences = 7;
}
message UpdateWorkloadIssuerRequest {
  string request_id = 1;
  // The issuer; its org and name say which. Required.
  WorkloadIssuerSpec issuer = 2;
  // Create it when absent.
  bool allow_missing = 3;
}
message UpdateWorkloadIssuerResponse {
  WorkloadIssuerSpec issuer = 1;
}
message ListWorkloadIssuersRequest {
  // `orgs/{org}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListWorkloadIssuersResponse {
  repeated WorkloadIssuerSpec issuers = 1;
  string next_page_token = 2;
}
message DeleteWorkloadIssuerRequest {
  string request_id = 1;
  // `orgs/{org}/workloadIssuers/{issuer}`. Required.
  string name = 2;
}
message DeleteWorkloadIssuerResponse {}

message IdentityProviderSpec {
  string org = 1;
  string name = 2;
  string issuer = 3;
  string client_id = 4;
  // Wrapped by the instance's key service before it is stored; never
  // returned.
  optional string client_secret = 5;
  optional string cli_client_id = 6;
  repeated string scopes = 7;
  // Defaults to `preferred_username`.
  optional string username_claim = 8;
  optional string groups_claim = 9;
  bool auto_provision = 10;
  // A SAML 2.0 provider instead of OIDC: the IdP's metadata XML. `issuer`
  // is then taken from it and the client fields are ignored; the username
  // is the NameID unless `username_claim` names an attribute, and groups
  // come from the attribute `groups_claim` names.
  optional string saml_metadata = 11;
  // Rill's entity id at the IdP; defaults to
  // `<public_url>/auth/saml/<org>/<name>`.
  optional string saml_sp_entity_id = 12;
}
message IdentityProviderInfo {
  // `orgs/{org}/identityProviders/{provider}`.
  string resource_name = 14;
  string org = 1;
  string name = 2;
  string issuer = 3;
  string client_id = 4;
  bool has_client_secret = 5;
  optional string cli_client_id = 6;
  repeated string scopes = 7;
  string username_claim = 8;
  optional string groups_claim = 9;
  bool auto_provision = 10;
  int64 created_at = 11;
  bool saml = 12;
  optional string saml_sp_entity_id = 13;
}

message GetIdentityProviderRequest {
  // `orgs/{org}/identityProviders/{provider}`. Required.
  string name = 1;
}
message GetIdentityProviderResponse {
  IdentityProviderInfo provider = 1;
}
message UpdateIdentityProviderRequest {
  string request_id = 1;
  // The provider; its org and name say which. Required.
  IdentityProviderSpec provider = 2;
  // Create it when absent.
  bool allow_missing = 3;
}
message UpdateIdentityProviderResponse {
  IdentityProviderInfo provider = 1;
}
message ListIdentityProvidersRequest {
  // `orgs/{org}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListIdentityProvidersResponse {
  repeated IdentityProviderInfo providers = 1;
  string next_page_token = 2;
}
message DeleteIdentityProviderRequest {
  string request_id = 1;
  // `orgs/{org}/identityProviders/{provider}`. Required.
  string name = 2;
}
message DeleteIdentityProviderResponse {}

message User {
  // `orgs/{org}/users/{user}`, by user name. Output only.
  string name = 11;
  // Output only.
  string etag = 12;
  string org = 1;
  Principal principal = 2;
  optional string email = 3;
  optional string display_name = 4;
  // `active` or `suspended`.
  string status = 5;
  // `admin`.
  repeated string roles = 6;
  repeated string teams = 7;
  // `issuer#subject` for each linked identity.
  repeated string external = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}
message ListUsersRequest {
  // `orgs/{org}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // On `status` (`active`, `suspended`), `roles` and `teams`.
  string filter = 4;
}
message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}
message UpdateUserRequest {
  string request_id = 1;
  // The user, by `name`, with the fields to change. Required.
  User user = 2;
  // `status` (`active` or `suspended`) and/or `roles`. Required.
  google.protobuf.FieldMask update_mask = 3;
  // The etag read; empty means no condition.
  string etag = 4;
}
message UpdateUserResponse {
  User user = 1;
}

message RevokeTokenRequest {
  string request_id = 1;
  oneof target {
    // The token itself: revokes its token id.
    string token = 2;
    // `tk_…`; administrators only.
    string token_id = 3;
  }
  string reason = 4;
}
message RevokeTokenResponse {
  string token_id = 1;
}

message RevokeSessionRequest {
  string request_id = 1;
  // `ss_…`
  string session = 2;
}
message RevokeSessionResponse {}

message RotateTokenKeysRequest {
  string request_id = 1;
}
message RotateTokenKeysResponse {
  // Absent when another server rotated at the same moment.
  optional uint32 key_id = 1;
  int64 active_from = 2;
}

message ListTokenKeysRequest {}
message TokenKey {
  uint32 id = 1;
  // Hex compressed P-256 public key.
  string public_key = 2;
  // The key service that wraps it and the wrapping key.
  string backend = 3;
  string key_ref = 4;
  int64 created_at = 5;
  int64 active_from = 6;
  optional int64 not_after = 7;
}
message ListTokenKeysResponse {
  repeated TokenKey keys = 1;
}
