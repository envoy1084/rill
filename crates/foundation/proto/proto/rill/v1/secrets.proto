// Secret service: org secrets that verify plans give their steps as
// environment variables. Values are write-only: no call returns one.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

service SecretService {
  // Set a secret (org administrators).
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Names and scopes, never values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
}

message SecretInfo {
  string name = 1;
  // Repositories whose plans may use it; empty is every repository.
  repeated string repos = 2;
  // Only verification after landing gets it.
  bool trunk_only = 3;
  int64 updated_at = 4;
  Principal updated_by = 5;
}

message PutSecretRequest {
  bytes operation_id = 1;
  string org = 2;
  string name = 3;
  bytes value = 4;
  repeated string repos = 5;
  bool trunk_only = 6;
}
message PutSecretResponse {
  SecretInfo secret = 1;
}

message DeleteSecretRequest {
  bytes operation_id = 1;
  string org = 2;
  string name = 3;
}
message DeleteSecretResponse {
  bool deleted = 1;
}

message ListSecretsRequest {
  string org = 1;
}
message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}
