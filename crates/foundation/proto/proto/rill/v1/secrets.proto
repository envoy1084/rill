// Secrets: org secrets that verify plans give their steps as environment
// variables. Values are write-only: no call returns one.
//
// A secret is `orgs/{org}/secrets/{secret}`.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

// Org secrets.
service SecretService {
  // Set a secret, or with `allow_missing` create it (org administrators).
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
  // Remove a secret (org administrators).
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Names and scopes, never values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
}

// A secret, without its value.
message Secret {
  // `orgs/{org}/secrets/{secret}`.
  string name = 1;
  // Repositories whose plans may use it; empty is every repository.
  repeated string repos = 2;
  // Only verification after landing gets it.
  bool trunk_only = 3;
  // Output only.
  int64 updated_at = 4;
  // Output only.
  Principal updated_by = 5;
}

message UpdateSecretRequest {
  string request_id = 1;
  // The secret, by `name`, with its scope. Required.
  Secret secret = 2;
  // The value; never returned. Required.
  bytes value = 3;
  // Create it when absent.
  bool allow_missing = 4;
}
message UpdateSecretResponse {
  Secret secret = 1;
}

message DeleteSecretRequest {
  string request_id = 1;
  // `orgs/{org}/secrets/{secret}`. Required.
  string name = 2;
}
message DeleteSecretResponse {}

message ListSecretsRequest {
  // `orgs/{org}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListSecretsResponse {
  repeated Secret secrets = 1;
  string next_page_token = 2;
}
