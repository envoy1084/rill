// The repository event log: one event per committed state change.
syntax = "proto3";

package rill.v1;

import "rill/v1/types.proto";

message WatchEventsRequest {
  string repo = 1;
  // Absent: start after the newest event, so only new events are sent.
  // Empty: replay from the oldest retained event. Otherwise resume after
  // this cursor, taken from an earlier EventEnvelope.
  optional bytes after = 2;
  // Event kinds to send ("ref_moved", "landed", ...); empty sends all.
  repeated string kinds = 3;
  // Only events about this change.
  optional bytes change_id = 4;
  // Only ref moves of refs starting with this prefix.
  optional string ref_prefix = 5;
}

message EventEnvelope {
  bytes cursor = 1;
  Event event = 2;
}

message Event {
  Principal actor = 1;
  int64 at = 2;
  oneof kind {
    RepoCreatedEvent repo_created = 10;
    RefMovedEvent ref_moved = 11;
    ReviewSubmittedEvent review_submitted = 12;
    VotedEvent voted = 13;
    CommentedEvent commented = 14;
    ThreadResolvedEvent thread_resolved = 15;
    StackSetEvent stack_set = 16;
    WorkspaceChangedEvent workspace_changed = 17;
    WorkspaceDeletedEvent workspace_deleted = 18;
    IntentChangedEvent intent_changed = 19;
    RelationChangedEvent relation_changed = 20;
    PolicyChangedEvent policy_changed = 21;
    VersionStoredEvent version_stored = 22;
    StatusChangedEvent status_changed = 23;
    LandedEvent landed = 24;
    LandRequestedEvent land_requested = 25;
    LandStatusChangedEvent land_status_changed = 26;
  }
}

message RepoCreatedEvent {
  string name = 1;
}
message RefMovedEvent {
  string name = 1;
  optional bytes old = 2;
  optional bytes new = 3;
}
message ReviewSubmittedEvent {
  bytes change_id = 1;
  bytes version = 2;
}
message VotedEvent {
  bytes change_id = 1;
  string label = 2;
  int32 value = 3;
  bytes version = 4;
}
message CommentedEvent {
  bytes change_id = 1;
  string thread_id = 2;
  bool new_thread = 3;
}
message ThreadResolvedEvent {
  bytes change_id = 1;
  string thread_id = 2;
  bool resolved = 3;
}
message StackSetEvent {
  bytes change_id = 1;
  repeated bytes stack = 2;
}
message WorkspaceChangedEvent {
  bytes workspace_id = 1;
  bytes operation_id = 2;
}
message WorkspaceDeletedEvent {
  bytes workspace_id = 1;
}
message IntentChangedEvent {
  bytes intent_id = 1;
}
message RelationChangedEvent {
  string object = 1;
  string relation = 2;
  string subject = 3;
  bool added = 4;
}
message PolicyChangedEvent {
  string name = 1;
}
message VersionStoredEvent {
  bytes version = 1;
  bytes change_id = 2;
}
message StatusChangedEvent {
  bytes change_id = 1;
  ReviewStatus from = 2;
  ReviewStatus to = 3;
}
message LandedEvent {
  uint64 seq = 1;
  bytes version = 2;
  bytes change_id = 3;
}
message LandRequestedEvent {
  string ticket = 1;
  bytes change_id = 2;
  // "emergency", "human", "agent" or "bulk".
  string lane = 3;
}
message LandStatusChangedEvent {
  string ticket = 1;
  bytes change_id = 2;
  // "queued", "verifying", "landing", "landed", "failed", "conflict",
  // "returned" or "ejected".
  string status = 3;
  // Why it failed, was returned or ejected.
  optional string reason = 4;
  // Where it landed.
  optional uint64 seq = 5;
  // The paths a conflicting rebase stopped on.
  repeated string conflict_paths = 6;
}
