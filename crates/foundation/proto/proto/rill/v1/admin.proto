// Admin: the server's health, and importing existing history.
syntax = "proto3";

package rill.v1;

// Instance operations.
service AdminService {
  // The server's components and whether each is healthy.
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  // Append an imported version to trunk, for importers of existing
  // history (repository owners).
  rpc ImportTrunkPosition(ImportTrunkPositionRequest) returns (ImportTrunkPositionResponse);
}

message ImportTrunkPositionRequest {
  string request_id = 1;
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 2;
  // The trunk head the version goes on; absent for an empty trunk.
  optional bytes expected = 3;
  // Required.
  bytes version = 4;
}
message ImportTrunkPositionResponse {
  uint64 position = 1;
}

message GetHealthRequest {}

message ComponentHealth {
  string name = 1;
  bool ok = 2;
  optional string detail = 3;
}
message GetHealthResponse {
  bool ok = 1;
  string version = 2;
  repeated ComponentHealth components = 3;
  // Hex compressed P-256 public key commit attestations are signed with.
  string attestation_key = 4;
}
