// Reviews: votes, threads, stacks and whether a change may land.
//
// A change's review is `orgs/{org}/repos/{repo}/changes/{change}/review`;
// a thread on it is `…/review/threads/{thread}`.
syntax = "proto3";

package rill.v1;

import "rill/v1/landing.proto";
import "rill/v1/types.proto";

// Reviews of changes.
service ReviewService {
  // A change's review and the labels it is voted on.
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse);
  // Up to 1,000 reviews.
  rpc BatchGetReviews(BatchGetReviewsRequest) returns (BatchGetReviewsResponse);
  // A repository's reviews.
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  // Submit a change for review.
  rpc SubmitChange(SubmitChangeRequest) returns (SubmitChangeResponse);
  // Vote on a label.
  rpc Vote(VoteRequest) returns (VoteResponse);
  // Start a thread on a review.
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  // Reply on a thread.
  rpc ReplyThread(ReplyThreadRequest) returns (ReplyThreadResponse);
  // Resolve or reopen a thread.
  rpc ResolveThread(ResolveThreadRequest) returns (ResolveThreadResponse);
  // Order changes into a stack, bottom first.
  rpc UpdateStack(UpdateStackRequest) returns (UpdateStackResponse);
  // Whether the repository's policy lets a change land now, and why not.
  rpc EvaluateLanding(EvaluateLandingRequest) returns (EvaluateLandingResponse);
  // Abandon a change.
  rpc AbandonChange(AbandonChangeRequest) returns (AbandonChangeResponse);
  // A review's updates as they happen.
  rpc WatchReview(WatchReviewRequest) returns (stream WatchReviewResponse);
  // The owner sets covering a path, by trunk's `OWNERS.toml` files.
  rpc GetOwners(GetOwnersRequest) returns (GetOwnersResponse);
  // Each owner set a change touches, with its approvals and escalation.
  rpc ExplainOwnership(ExplainOwnershipRequest) returns (ExplainOwnershipResponse);
  // What the author changed between two versions of a change, with paths
  // that only moved with a rebase listed apart.
  rpc GetInterdiff(GetInterdiffRequest) returns (GetInterdiffResponse);
  // Apply a thread's suggested edit as a new version (the change's owner).
  rpc ApplySuggestion(ApplySuggestionRequest) returns (ApplySuggestionResponse);
  // Reopen an abandoned change.
  rpc ReopenChange(ReopenChangeRequest) returns (ReopenChangeResponse);
}

message GetReviewRequest {
  // `…/changes/{change}/review`. Required.
  string name = 1;
}
message GetReviewResponse {
  ReviewState review = 1;
  repeated Label labels = 2;
}

message BatchGetReviewsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  // At most 1,000 review names.
  repeated string names = 2;
}
message BatchGetReviewsResponse {
  // Parallel to `names`.
  repeated ReviewState reviews = 1;
}

message ListReviewsRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
  // On `status` (`open`, `approved`, `landing`, `landed`, `abandoned`, …),
  // `owner` (`ann`, `agent:bot`) and `intent` (an intent id).
  string filter = 4;
}
message ListReviewsResponse {
  repeated ReviewState reviews = 1;
  string next_page_token = 2;
}

message SubmitChangeRequest {
  string request_id = 1;
  // `…/changes/{change}`. Required.
  string change = 2;
}
message SubmitChangeResponse {
  ReviewState review = 1;
}

message VoteRequest {
  string request_id = 1;
  // `…/changes/{change}/review`. Required.
  string review = 2;
  // Required.
  string label = 3;
  int32 value = 4;
  optional string reason = 5;
  // The version voted on, `…/versions/{hash}`; the current one when empty.
  string version = 6;
}
message VoteResponse {
  ReviewState review = 1;
}

message CreateThreadRequest {
  string request_id = 1;
  // `…/changes/{change}/review`. Required.
  string parent = 2;
  ThreadAnchor anchor = 3;
  // Required.
  string body = 4;
  optional CommentCategory category = 5;
  optional uint32 confidence = 6;
  optional Principal to = 7;
  // Replacement text for the anchored lines (a `lines` anchor on the
  // current version), which the change's author can apply.
  optional string suggestion = 8;
}
message CreateThreadResponse {
  Thread thread = 1;
}

message ReplyThreadRequest {
  string request_id = 1;
  // `…/review/threads/{thread}`. Required.
  string name = 2;
  // Required.
  string body = 3;
  optional CommentCategory category = 4;
  optional uint32 confidence = 5;
}
message ReplyThreadResponse {
  Thread thread = 1;
}

message ResolveThreadRequest {
  string request_id = 1;
  // `…/review/threads/{thread}`. Required.
  string name = 2;
  // False reopens the thread.
  bool resolved = 3;
}
message ResolveThreadResponse {
  Thread thread = 1;
}

message UpdateStackRequest {
  string request_id = 1;
  // `orgs/{org}/repos/{repo}`. Required.
  string parent = 2;
  // Change names, bottom first; every change gets the same stack.
  repeated string changes = 3;
}
message UpdateStackResponse {
  repeated ReviewState reviews = 1;
}

message EvaluateLandingRequest {
  // `…/changes/{change}`. Required.
  string change = 1;
}
message SubmitDecision {
  bool allowed = 1;
  repeated string reasons = 2;
  repeated string matched_policies = 3;
  RiskClass risk = 4;
  repeated string risk_reasons = 5;
}
message EvaluateLandingResponse {
  SubmitDecision decision = 1;
}

message AbandonChangeRequest {
  string request_id = 1;
  // `…/changes/{change}`. Required.
  string change = 2;
  optional string reason = 3;
}
message AbandonChangeResponse {
  ReviewState review = 1;
}

message WatchReviewRequest {
  // `…/changes/{change}/review`. Required.
  string name = 1;
}

message WatchReviewResponse {
  bytes change_id = 1;
  int64 at = 2;
  oneof event {
    ReviewStatus status_changed = 3;
    LabelVote voted = 4;
    Thread thread_updated = 5;
    bytes new_version = 6;
    LandRequest land_update = 7;
  }
}

// A group of principals of which `required` must approve a change that
// touches the paths it covers.
message OwnerSet {
  // `<dir>#default` or `<dir>#rule<n>`.
  string id = 1;
  // The directory whose `OWNERS.toml` declares it; empty for the root.
  string dir = 2;
  // `user:<name>`, `agent:<name>` or `team:<name>`.
  repeated string owners = 3;
  uint32 required = 4;
  // Touching it makes a change at least `sensitive`.
  bool sensitive = 5;
  // How long a required review may wait before escalating.
  optional int64 sla_ms = 6;
  optional string escalate_to = 7;
}

message GetOwnersRequest {
  // `orgs/{org}/repos/{repo}`. Required.
  string repo = 1;
  // A file path. Required.
  string path = 2;
}
message GetOwnersResponse {
  repeated OwnerSet sets = 1;
}

message ExplainOwnershipRequest {
  // `…/changes/{change}`. Required.
  string change = 1;
}
// One owner set's state for a change.
message OwnerSetStatus {
  OwnerSet set = 1;
  // Distinct approvers who count for the set.
  uint32 approvals = 2;
  bool covered = 3;
  // Where an overdue review was escalated to, and how many times.
  optional string escalated_to = 4;
  uint32 escalations = 5;
}
message ExplainOwnershipResponse {
  repeated OwnerSetStatus sets = 1;
  // Every set is covered (true when the change touches none).
  bool covered = 2;
}


message GetInterdiffRequest {
  // `…/changes/{change}`. Required.
  string change = 1;
  // The versions compared; empty `to` is the current version, empty
  // `from` the one before it.
  string from = 2;
  string to = 3;
}
message InterdiffFile {
  string path = 1;
  // Unified diff from the old version's content to the new one's.
  string unified = 2;
  bool added = 3;
  bool deleted = 4;
}
message GetInterdiffResponse {
  string from = 1;
  string to = 2;
  repeated InterdiffFile files = 3;
  // Paths whose patch is the same in both: they moved with the base only.
  repeated string rebased = 4;
}

message ApplySuggestionRequest {
  string request_id = 1;
  // `…/review/threads/{thread}`. Required.
  string thread = 2;
}
message ApplySuggestionResponse {
  ChangeInfo info = 1;
}

message ReopenChangeRequest {
  string request_id = 1;
  // `…/changes/{change}`. Required.
  string change = 2;
}
message ReopenChangeResponse {
  ReviewState review = 1;
}
