[package]
name = "rill-cli"
description = "The `rill` command: the client, `rill dev` and `rill api`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rill_cli"
path = "src/lib.rs"

[features]
# Let `rill api` keep metadata in FoundationDB.
fdb = ["rill-api/fdb"]
# AWS KMS and Google Cloud KMS as token key services.
aws = ["rill-api/aws"]
gcp = ["rill-api/gcp"]
# SAML 2.0 sign-in. Needs libxml2 and xmlsec1.
saml = ["rill-api/saml"]

[[bin]]
name = "rill"
path = "src/bin/rill.rs"


[dependencies]
rill-sdk = { workspace = true }
rill-mcp = { workspace = true }
rill-types = { workspace = true }
rill-core = { workspace = true }
rill-cache = { workspace = true }
rill-api = { workspace = true }
rill-store = { workspace = true }
rill-git-import = { workspace = true }
rill-identity = { workspace = true }
rill-proto = { workspace = true }
rill-policy = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
comfy-table = { workspace = true }
owo-colors = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
tonic = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
rill-identity = { workspace = true, features = ["testing"] }
rill-policy = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
tempfile = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
